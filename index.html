let state={role:'restaurante',page:'home',day:0,shipping:'zonas',fixed:1.25,cutoff:'11:00',restaurants:[{name:'Restaurante El Sabor',plan:'Pro',state:'Activo',orders:126,renew:'15 dic 2026'},{name:'Almuerzos Central',plan:'Básico',state:'Activo',orders:73,renew:'23 nov 2026'},{name:'Sazón Casero',plan:'Básico',state:'Por renovar',orders:39,renew:'17 nov 2026'},{name:'La Esquina',plan:'Pro',state:'Activo',orders:204,renew:'28 nov 2026'}],menuDays:['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],foods:[{id:'pollo',icon:'🍗',name:'Pollo a la plancha',desc:'Con arroz, ensalada y locro',price:3.5,count:20},{id:'carne',icon:'🥘',name:'Seco de carne',desc:'Con arroz, ensalada y locro',price:3.5,count:15},{id:'pescado',icon:'🐟',name:'Pescado apanado',desc:'Con arroz, ensalada y locro',price:3.5,count:8}],selectedFood:'pollo',clientPage:'home',address:'Av. República, Edificio Central, oficina 302',zone:'centro',receiptName:'',orderCreated:false,paymentConfirmed:false,prepared:false,delivered:false,orders:[],themeColor:'#18cfae'};
const sampleOrders=[{id:'#PF-1021',client:'María López',food:'Pollo',total:4.5,status:'Confirmado',zone:'Centro Norte'},{id:'#PF-1022',client:'Carlos Pérez',food:'Seco',total:4.5,status:'Por verificar',zone:'La Carolina'},{id:'#PF-1023',client:'Lucía Vega',food:'Pescado',total:5.0,status:'En camino',zone:'Iñaquito'},{id:'#PF-1024',client:'Andrea Mora',food:'Pollo',total:3.5,status:'Confirmado',zone:'Centro Norte'}];
const statusBadge=s=>`<span class="badge ${['Por verificar','Pendiente'].includes(s)?'warn':['Vencido','Rechazado'].includes(s)?'danger':['En camino','Activo'].includes(s)?'blue':''}"><i class="dot"></i>${s}</span>`;
function stat(label,num,note,color=''){return `<div class="card metric"><small>${label}</small><h2>${num}</h2><span class="trend ${color}">${note}</span></div>`}
function head(eyebrow,title,subtitle,action=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}
function panel(title,body,sub=''){return `<section class="card pad"><div class="section-title"><div><h3>${title}</h3>${sub?`<div class="sub">${sub}</div>`:''}</div></div>${body}</section>`}
function bizRows(data=state.restaurants){return `<div class="table-wrap"><table><thead><tr><th>Negocio</th><th>Plan</th><th>Actividad</th><th>Renovación</th><th>Estado</th></tr></thead><tbody>${data.map(r=>`<tr><td class="company">${r.name}</td><td>${r.plan}</td><td>${r.orders} pedidos</td><td>${r.renew}</td><td>${statusBadge(r.state==='Por renovar'?'Pendiente':r.state)}</td></tr>`).join('')}</tbody></table></div>`}
function faroHome(){return head('Visión general de Apps Faro','Tu negocio, bajo control','Un solo lugar para gestionar todas tus microapps y suscripciones.',`<button class="btn primary" onclick="go('businesses')">${ico('store')} Ver negocios</button>`)+`<div class="grid kpis">${stat('Negocios activos','4','3 renovaciones próximas')}${stat('Ingresos por suscripciones','$80','Datos de demostración')}${stat('Aplicaciones publicadas','1','Restaurantes')}${stat('Pedidos procesados','442','Actividad agregada')}</div><div class="split">${panel('Actividad de la plataforma',`<div class="chartbox"><div class="chart">${[40,59,48,75,63,88,72].map((v,i)=>`<div class="chartcol"><div class="bar" style="height:${v}%"></div><label>${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][i]}</label></div>`).join('')}</div></div>`,`Últimos siete días · datos ficticios`)}${panel('Próximas renovaciones',`<div class="line-list"><div class="line"><span>Sazón Casero</span>${statusBadge('Pendiente')}</div><div class="line"><span>Almuerzos Central</span><span class="tiny">23 nov.</span></div><div class="line"><span>La Esquina</span><span class="tiny">28 nov.</span></div></div><div class="notice" style="margin-top:19px">${ico('bell')}<div><strong>Cobros separados</strong><p>Los ingresos de Apps Faro son suscripciones, no ventas de almuerzos.</p></div></div>`)}</div><div style="margin-top:19px">${panel('Tus restaurantes registrados',bizRows())}</div>`}
function faroBusinesses(){return head('Administración comercial','Negocios','Control de restaurantes y suscripción de cada cuenta.',`<button class="btn primary" onclick="toast('Alta de negocio disponible cuando conectemos el backend.')">+ Nuevo restaurante</button>`)+`<div class="card pad">${bizRows()}<p class="footnote">Prototipo: los nombres y datos son ejemplos, no registros reales.</p></div>`}
function faroApps(){return head('Catálogo','Mis aplicaciones','El mismo administrador central servirá para las futuras microapps.')+`<div class="card pad" style="max-width:600px"><div class="text-row"><div class="mobile-logo"><i>${ico('store',22)}</i><div><b>Restaurantes</b><div class="tiny">Gestión de almuerzos y entregas</div></div></div>${statusBadge('Activo')}</div><div class="rule"></div><div class="grid kpis" style="grid-template-columns:repeat(2,1fr);margin-bottom:0">${stat('Suscripciones','4','Demostración')}${stat('Pedidos','442','Demostración')}</div><p class="footnote">Cuando agregues otras microapps, aparecerán aquí con su propia actividad.</p></div>`}
function faroSubscriptions(){return head('Negocio SaaS','Suscripciones y renovaciones','Panel comercial de Apps Faro; independiente de las transferencias de almuerzos.')+`<div class="grid kpis">${stat('Plan básico','2','Negocios')}${stat('Plan Pro','2','Negocios')}${stat('Por renovar','1','Revisar vencimiento','orange')}${stat('MRR estimado','$80','Solo ejemplo')}</div>${panel('Suscripciones activas',bizRows())}`}
function faroAnalytics(){return head('Analítica','Adopción y rendimiento','Indicadores agregados, sin mostrar comprobantes ni credenciales personales.')+`<div class="grid kpis">${stat('Pedidos semanales','442','Total agregado')}${stat('Restaurantes con uso','4 de 4','Actividad reciente')}${stat('Menús publicados','24','Última semana')}${stat('Suscripciones activas','4','Demostración')}</div>${panel('Tendencia de pedidos',`<div class="chartbox"><div class="chart">${[32,50,55,60,72,88,68].map((v,i)=>`<div class="chartcol"><div class="bar" style="height:${v}%"></div><label>${['L','M','M','J','V','S','D'][i]}</label></div>`).join('')}</div></div>`)}`}
function faroGeneric(){return head('Apps Faro',state.page==='support'?'Soporte':'Configuración general','Gestión central, permisos y suscripciones de las futuras microapps.')+`<div class="card pad"><div class="notice">${ico('settings')}<div><strong>Sección definida en arquitectura</strong><p>Su integración con el backend se hará en la fase de construcción. Esta pantalla demuestra la navegación final.</p></div></div></div>`}
function restaurantHome(){return head('Restaurante El Sabor','Un vistazo a tu restaurante','Lunes 16 de noviembre · tus pedidos, cobros y entregas en un mismo lugar.',`<button class="btn primary" onclick="go('menu')">${ico('calendar')} Editar menú</button>`)+`<div class="grid kpis">${stat('Pedidos del día','48','43 confirmados')}${stat('Venta verificada','$150,50','Pagos bancarios confirmados')}${stat('Por verificar',state.orderCreated&&!state.paymentConfirmed?'6':'5','Requieren revisión','orange')}${stat('En camino','18','Entregas en curso')}</div><div class="split">${panel('Producción de cocina',state.foods.map(f=>`<div class="item-line"><div><div class="text-row"><strong>${f.name}</strong><small>${f.count} platos</small></div><div class="progress" style="margin-top:9px"><span style="width:${f.count/25*100}%"></span></div></div><b>${f.count}</b></div>`).join('')+`<button class="btn ghost" style="margin-top:8px" onclick="go('kitchen')">Ir a cocina ${ico('arrow')}</button>`)}${panel('Alertas y horarios',`<div class="notice">${ico('time')}<div><strong>Recepción hasta las ${state.cutoff}</strong><p>Después del cierre se ofrece el próximo día con menú publicado.</p></div></div><div class="notice" style="margin-top:12px;background:#fff9ed;border-color:#f6e4ca">${ico('receipt')}<div><strong>${state.orderCreated&&!state.paymentConfirmed?'6':'5'} pagos esperando revisión</strong><p>Los comprobantes no se consideran pagos confirmados hasta cotejarlos con el banco.</p></div></div><button class="btn ghost" style="margin-top:17px" onclick="go('payments')">Revisar pagos ${ico('arrow')}</button>`)}</div><div style="margin-top:19px">${panel('Pedidos recientes',orderTable())}</div>`}
function foodRow(f){return `<div class="food-row"><span class="food-art">${f.icon}</span><div><strong>${f.name}</strong><small>${f.desc}</small></div><b>${money(f.price)}</b></div>`}
function restaurantMenu(){return head('Planificación','Menú semanal','Organiza sopas, segundos y especiales por día; publica cuando esté listo.',`<button class="btn primary" onclick="toast('Menú de demostración: publicación simulada.')">${ico('check')} Publicar semana</button>`)+`<div class="card pad"><div class="daybar">${state.menuDays.map((d,i)=>`<button class="day ${state.day===i?'active':''}" onclick="selectDay(${i})">${d.slice(0,3)}<span>${16+i} nov</span></button>`).join('')}</div><div class="split"><div><div class="section-title"><h3>${state.menuDays[state.day]} · almuerzos</h3><span class="badge ${state.day?'warn':''}">${state.day?'Borrador':'Publicado'}</span></div><div class="field-group"><div class="compact-heading">Sopa del día</div><div class="highlight">Locro de papa · Incluido en el almuerzo</div></div><div class="compact-heading">Opciones de segundo</div>${state.foods.map(foodRow).join('')}<div class="compact-heading">Plato especial</div>${foodRow({icon:'🥩',name:'Parrillada especial',desc:'Porción especial con bebida',price:6})}<button class="btn ghost" style="margin-top:14px" onclick="toast('En la versión real podrás agregar más platos y extras.')">+ Agregar plato</button></div><div>${panel('Configuración del día',`<div class="field"><label>Cierre de pedidos</label><input class="input" type="time" value="${state.cutoff}" oninput="state.cutoff=this.value"></div><div class="field" style="margin-top:14px"><label>Hora estimada de entrega</label><input class="input" value="12:00 – 14:00" aria-label="Horario de entrega"></div><div class="field" style="margin-top:14px"><label>Cantidad máxima de pedidos</label><input class="input" type="number" min="1" value="80"></div><button class="btn primary" style="margin-top:18px;width:100%" onclick="toast('Configuración guardada sólo en esta demostración.')">Guardar configuración</button><p class="footnote">Se guarda por día; no alteramos los pedidos realizados previamente.</p>`)}</div></div></div>`}
function orderTable(){const o=[...sampleOrders];if(state.orderCreated)o.unshift({id:'#AF-1050',client:'Cliente demo',food:state.foods.find(f=>f.id===state.selectedFood).name,total:state.foods.find(f=>f.id===state.selectedFood).price+shipFee(),status:state.paymentConfirmed?'Confirmado':'Por verificar',zone:'Centro Norte'});return `<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Almuerzo</th><th>Total</th><th>Estado</th></tr></thead><tbody>${o.map(row=>`<tr><td class="company">${row.id}</td><td>${row.client}</td><td>${row.food}</td><td>${money(row.total)}</td><td>${statusBadge(row.status)}</td></tr>`).join('')}</tbody></table></div>`}
function restaurantOrders(){return head('Operaciones','Pedidos','Consulta pedidos por día y revisa su estado.')+`<div class="grid kpis">${stat('Recibidos','48','Hoy')}${stat('Confirmados','43','Listos para cocina')}${stat('Por verificar',state.orderCreated&&!state.paymentConfirmed?'6':'5','No contabilizados en cocina','orange')}${stat('Entregados','25','Finalizados')}</div>${panel('Listado de pedidos',orderTable())}`}
function restaurantPayments(){return head('Verificación bancaria','Comprobantes','Comprueba el dinero recibido antes de confirmar cada pago.')+`<div class="grid kpis">${stat('Por verificar',state.orderCreated&&!state.paymentConfirmed?'6':'5','Abrir comprobantes','orange')}${stat('Confirmados','43','Verificados en banco')}${stat('Sospechosos','1','Ejemplo de alerta','orange')}${stat('Rechazados','0','Últimas 24 h')}</div><div class="split">${panel('Bandeja de comprobantes',`<div class="line-list">${state.orderCreated?`<div class="line"><div><b>#AF-1050 · Cliente demo</b><div class="tiny">${state.receiptName||'Archivo adjunto'} · ${money(state.foods.find(f=>f.id===state.selectedFood).price+shipFee())}</div></div>${state.paymentConfirmed?statusBadge('Confirmado'):`<button class="btn small primary" onclick="verifyPayment()">Confirmar pago</button>`}</div>`:''}<div class="line"><div><b>#PF-1022 · Carlos Pérez</b><div class="tiny">Transferencia por verificar · $4,50</div></div>${statusBadge('Por verificar')}</div><div class="line"><div><b>#PF-1019 · Luis V.</b><div class="tiny">Referencia repetida (ejemplo)</div></div>${statusBadge('Pendiente')}</div></div>`)}${panel('Procedimiento seguro',`<div class="notice">${ico('receipt')}<div><strong>Un archivo no es un pago</strong><p>Comprueba en tu banco monto, fecha, beneficiario y referencia. La imagen puede ser falsa o reutilizada.</p></div></div><p class="footnote">En la app real, cada revisión quedará registrada con usuario, fecha, decisión y motivo.</p>`)}</div>`}
function restaurantKitchen(){return head('Producción','Resumen de cocina','Cantidades de pedidos confirmados, no de comprobantes sin revisar.')+`<div class="grid kpis">${stat('Para preparar',state.paymentConfirmed?'44':'43','Pedidos confirmados')}${stat('En preparación','18','Producción')}${stat('Listos','7','Esperan reparto')}${stat('Por verificar',state.paymentConfirmed?'5':'6','Fuera del conteo','orange')}</div>${panel('Cantidad por plato',state.foods.map(f=>`<div class="food-row"><div class="food-art">${f.icon}</div><div style="flex:1"><strong>${f.name}</strong><div class="progress" style="margin-top:12px"><span style="width:${f.count/24*100}%"></span></div></div><b>${f.count+(state.paymentConfirmed&&state.selectedFood===f.id?1:0)} platos</b></div>`).join(''))}`}
function restaurantDeliveries(){return head('Logística','Entregas y rutas','Organiza pedidos por zona, dirección y salida de reparto.')+`<div class="grid kpis">${stat('En ruta','18','Despachados')}${stat('Listos','7','Por asignar')}${stat('Entregados','25','Hoy')}${stat('Zonas','3','Configuradas')}</div>${panel('Entregas del día',`<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Dirección</th><th>Zona</th><th>Estado</th></tr></thead><tbody><tr><td>#PF-1021</td><td>Av. República, piso 3</td><td>Centro Norte</td><td>${statusBadge('Confirmado')}</td></tr><tr><td>#PF-1023</td><td>Av. Amazonas</td><td>Iñaquito</td><td>${statusBadge('En camino')}</td></tr><tr><td>#PF-1024</td><td>Sector La Carolina</td><td>Centro Norte</td><td>${statusBadge('Confirmado')}</td></tr></tbody></table></div><p class="footnote">Las agrupaciones de rutas son manuales en la primera versión; no prometemos optimización geográfica automática.</p>`)}`}
function restaurantCustomers(){return head('Relaciones','Clientes','Historial de consumo y direcciones de entrega, sin compra fiada.')+`${panel('Clientes de ejemplo',`<div class="line-list"><div class="line"><span><b>María López</b><div class="tiny">18 pedidos realizados</div></span>${statusBadge('Activo')}</div><div class="line"><span><b>Carlos Pérez</b><div class="tiny">13 pedidos realizados</div></span>${statusBadge('Activo')}</div><div class="line"><span><b>Lucía Vega</b><div class="tiny">21 pedidos realizados</div></span>${statusBadge('Activo')}</div></div>`)}`}
function restaurantReports(){return head('Inteligencia operativa','Reportes','Indicadores basados únicamente en pedidos y pagos reales confirmados.')+`<div class="grid kpis">${stat('Ventas verificadas','$150,50','Hoy')}${stat('Ticket promedio','$3,50','Solo ejemplo')}${stat('Plato más pedido','Pollo','20 pedidos')}${stat('Entregas completadas','25','Hoy')}</div>${panel('Pedidos por día',`<div class="chartbox"><div class="chart">${[35,58,68,53,77,92,64].map((v,i)=>`<div class="chartcol"><div class="bar" style="height:${v}%"></div><label>${['L','M','M','J','V','S','D'][i]}</label></div>`).join('')}</div></div>`)}`}
function restaurantSettings(){return head('Personalización','Configuración del restaurante','El propietario define su marca, banco, cobertura y precio de entrega.',`<button class="btn primary" onclick="saveSettings()">Guardar cambios</button>`)+`<div class="split"><div class="stack">${panel('Identidad del negocio',`<div class="form-grid"><div class="field"><label>Nombre comercial</label><input class="input" value="Restaurante El Sabor"></div><div class="field"><label>WhatsApp de contacto</label><input class="input" placeholder="+593 ..."></div><div class="field"><label>Color principal</label><input class="input" type="color" value="${state.themeColor}" oninput="state.themeColor=this.value;document.documentElement.style.setProperty('--mint',this.value)"></div><div class="field"><label>Logo</label><input type="file" accept="image/*" class="input"></div></div><p class="footnote">La personalización final se aplicará a la app móvil de los clientes de ese restaurante.</p>`)}${panel('Modalidad de envío',`<div class="radio-chips" id="shippingChips">${[['gratis','Gratis'],['fijo','Tarifa fija'],['zonas','Por zonas']].map(([k,v])=>`<button class="chip ${state.shipping===k?'active':''}" onclick="setShipping('${k}')">${v}</button>`).join('')}</div><div id="shippingDetail" style="margin-top:17px">${shippingDetails()}</div><div class="notice" style="margin-top:16px">${ico('pin')}<div><strong>Entrega únicamente a domicilio u oficina</strong><p>El cliente deberá seleccionar una zona cubierta antes de finalizar y pagar.</p></div></div>`)} </div><div class="stack">${panel('Horarios del negocio',`<div class="field"><label>Cierre de pedidos del día</label><input type="time" class="input" id="cutoffInp" value="${state.cutoff}" onchange="state.cutoff=this.value"></div><div class="field" style="margin-top:15px"><label>Horario de entrega</label><input class="input" value="12:00 a 14:00"></div><p class="footnote">En producción habrá horarios independientes por día de la semana y excepciones por feriados.</p>`)}${panel('Cuenta bancaria',`<div class="form-grid"><div class="field"><label>Banco</label><input class="input" placeholder="Banco del restaurante"></div><div class="field"><label>Titular</label><input class="input" placeholder="Nombre del titular"></div><div class="field"><label>Número de cuenta</label><input class="input" placeholder="Cuenta destino de transferencias"></div><div class="field"><label>Tipo de cuenta</label><select><option>Ahorros</option><option>Corriente</option></select></div></div><p class="footnote">El sistema siempre mostrará al cliente la cuenta confirmada del restaurante, nunca una cuenta escrita por otro cliente.</p>`)}</div></div>`}
function shippingDetails(){return state.shipping==='gratis'?'<div class="highlight">Los envíos son gratuitos dentro de las zonas de cobertura.</div>':state.shipping==='fijo'?`<div class="field"><label>Tarifa fija (USD)</label><input class="input" type="number" min="0" step="0.05" value="${state.fixed}" oninput="state.fixed=Number(this.value)"></div>`:`<div class="line-list"><div class="line"><span>Centro Norte</span><b>$1,00</b></div><div class="line"><span>La Carolina / Iñaquito</span><b>$1,50</b></div><div class="line"><span>Otros sectores cubiertos</span><b>$2,00</b></div></div><p class="footnote">En la versión real podrás añadir, editar, desactivar y delimitar zonas. El cliente escogerá sólo sectores habilitados.</p>`}
function setShipping(val){state.shipping=val;document.querySelectorAll('#shippingChips .chip').forEach(el=>el.classList.toggle('active',el.textContent===({gratis:'Gratis',fijo:'Tarifa fija',zonas:'Por zonas'}[val])));document.getElementById('shippingDetail').innerHTML=shippingDetails()}
function saveSettings(){let input=document.getElementById('cutoffInp');if(input)state.cutoff=input.value;toast('Cambios aplicados a esta demo. Aún no se guardan en Firebase.')}
function shipFee(){return state.shipping==='gratis'?0:state.shipping==='fijo'?state.fixed:state.zone==='centro'?1:state.zone==='carolina'?1.5:2}
function selected(){return state.foods.find(f=>f.id===state.selectedFood)||state.foods[0]}
function clientWrap(body){return `<div class="desktop-client-intro"><span class="eyebrow">Experiencia del cliente</span><span class="prototype">PROTOTIPO INTERACTIVO</span></div><div class="client-shell"><div class="client-top"><div class="text-row"><span class="client-brand">✦ RESTAURANTE EL SABOR</span>${ico('bell')}</div><h2>Tu almuerzo,<br>a un toque.</h2><p>Pedidos programados, pago por transferencia y entrega en tu oficina o domicilio.</p></div><div class="client-screen">${body}</div><nav class="mobile-nav">${[['home','Inicio','home'],['calendar','Semana','week'],['orders','Pedidos','orders'],['card','Pagos','payments'],['users','Perfil','profile']].map(([icon,label,page])=>`<button class="${state.page===page?'active':''}" onclick="go('${page}')">${ico(icon)}${label}</button>`).join('')}</nav></div>`}
function clientHome(){return clientWrap(`<div class="text-row"><h3>Menú de hoy</h3><span class="badge">Abierto hasta ${state.cutoff}</span></div><div class="highlight">Incluye locro de papa, segundo y acompañamientos. Elige tu favorito.</div><div class="compact-heading">Escoge tu segundo</div>${state.foods.map(f=>`<div class="client-food ${state.selectedFood===f.id?'active':''}" onclick="chooseFood('${f.id}')"><div class="food-art">${f.icon}</div><div style="flex:1"><strong>${f.name}</strong><p>${f.desc}</p><b>${money(f.price)}</b></div><div style="color:${state.selectedFood===f.id?'#0ea887':'#c4d3db'}">${ico('check')}</div></div>`).join('')}<button class="mobile-cta" onclick="go('checkout')">Continuar con mi pedido · ${money(selected().price)} →</button><p class="hint">El precio de entrega se calcula con tu dirección, antes de realizar el pago.</p>`) }
function clientWeek(){return clientWrap(`<h3>Menú de la semana</h3><p class="muted" style="font-size:12px;line-height:1.6">Puedes organizar tus almuerzos con anticipación y pagar cada pedido al confirmarlo.</p><div class="daybar">${state.menuDays.slice(0,5).map((d,i)=>`<button class="day ${state.day===i?'active':''}" onclick="selectDay(${i})">${d.slice(0,3)}<span>${16+i} nov</span></button>`).join('')}</div><div class="highlight">${state.menuDays[state.day]} · sopa: locro de papa</div>${state.foods.map(f=>`<div class="food-row"><div class="food-art">${f.icon}</div><div style="flex:1"><strong>${f.name}</strong><small>${money(f.price)}</small></div></div>`).join('')}<button class="mobile-cta" onclick="go('home')">Seleccionar almuerzo →</button>`)}
function clientCheckout(){return clientWrap(`<h3>Finaliza tu pedido</h3><div class="highlight">Pedido programado · Almuerzo para hoy, sujeto al horario de cierre.</div><div class="food-row"><div class="food-art">${selected().icon}</div><div style="flex:1"><strong>${selected().name}</strong><small>Sopa del día incluida · 1 almuerzo</small></div><b>${money(selected().price)}</b></div><div class="compact-heading">Dirección de entrega</div><div class="field-group"><input class="input" id="clientAddress" value="${escapeHtml(state.address)}" placeholder="Calle, número, edificio, piso, oficina"></div><div class="field"><label>Zona de entrega</label><select id="clientZone" onchange="state.zone=this.value;document.getElementById('costShip').textContent=money(shipFee());document.getElementById('costTotal').textContent=money(shipFee()+selected().price)"><option value="centro" ${state.zone==='centro'?'selected':''}>Centro Norte · ${money(state.shipping==='gratis'?0:state.shipping==='fijo'?state.fixed:1)}</option><option value="carolina" ${state.zone==='carolina'?'selected':''}>La Carolina / Iñaquito</option><option value="otros" ${state.zone==='otros'?'selected':''}>Otros sectores cubiertos</option></select></div><div class="compact-heading">Resumen del precio</div><div class="client-total"><span>Almuerzo</span><strong>${money(selected().price)}</strong></div><div class="client-total"><span>Entrega</span><strong id="costShip">${money(shipFee())}</strong></div><div class="rule"></div><div class="client-total"><b>Total a transferir</b><strong id="costTotal">${money(shipFee()+selected().price)}</strong></div><button class="mobile-cta" onclick="checkoutNext()">Continuar con el pago →</button><p class="hint">Primero verás el total. La aplicación no permitirá modificar montos o destinos luego de generar el pedido.</p>`)}
function clientPay(){return clientWrap(`<h3>Pago por transferencia</h3><div class="highlight warning">Tu pedido todavía no está pagado. Transfiere el total y adjunta el comprobante para revisión.</div><div class="compact-heading">Importe a transferir</div><div style="font-size:30px;font-weight:900;letter-spacing:-1px;color:#144e4d">${money(shipFee()+selected().price)}</div><div class="card pad" style="box-shadow:none;background:#f6f9fc;margin-top:12px;padding:15px"><div class="line"><span>Banco</span><b>Configurado por restaurante</b></div><div class="line"><span>Titular</span><b>Datos verificados por el negocio</b></div><div class="line"><span>Cuenta</span><b>Visible al conectar Firebase</b></div></div><div class="payments-file"><div style="color:#129b83">${ico('upload',24)}</div><b style="display:block;margin:8px 0;font-size:12px">Sube tu comprobante</b><input type="file" id="receiptUpload" accept="application/pdf,image/png,image/jpeg" onchange="receiptChosen(this)"><div class="hint" style="margin-top:8px">PDF, JPG o PNG · archivo local sólo para la demostración</div></div><button class="mobile-cta" onclick="submitReceipt()">Enviar pedido para verificación →</button><p class="hint">El comprobante se enviará al negocio en la aplicación real. En esta demo no se sube a ningún servidor.</p>`)}
function clientOrders(){return clientWrap(`<h3>Mis pedidos</h3>${state.orderCreated?`<div class="card pad" style="box-shadow:none"><div class="text-row"><b>#AF-1050</b>${statusBadge(state.paymentConfirmed?'Confirmado':'Por verificar')}</div><div class="rule"></div><div class="line"><span>${selected().name}</span><b>${money(selected().price+shipFee())}</b></div><div class="hint">Entrega a ${escapeHtml(state.address)}</div><button class="mobile-cta" onclick="go('tracking')">Seguir mi pedido →</button></div>`:`<div class="empty"><div class="big">▤</div>Todavía no has realizado pedidos en esta demo.<br><button class="btn primary" style="margin-top:14px" onclick="go('home')">Elegir almuerzo</button></div>`}`)}
function clientPayments(){return clientWrap(`<h3>Mis pagos</h3>${state.orderCreated?`<div class="card pad" style="box-shadow:none"><div class="text-row"><b>#AF-1050</b>${statusBadge(state.paymentConfirmed?'Confirmado':'Por verificar')}</div><div class="rule"></div><div class="line"><span>Monto enviado</span><b>${money(selected().price+shipFee())}</b></div><div class="line"><span>Comprobante</span><b style="max-width:160px;overflow:hidden;text-overflow:ellipsis">${escapeHtml(state.receiptName||'Adjuntado en demo')}</b></div><p class="footnote">La transferencia debe cotejarse en la cuenta bancaria real del restaurante.</p></div>`:`<div class="empty">Tus comprobantes de pago se mostrarán aquí después de comprar.</div>`}`)}
function clientTracking(){let stage=state.delivered?4:state.prepared?3:state.paymentConfirmed?2:1;let labels=['Pedido enviado','Pago verificado','En preparación','En camino','Entregado'];return clientWrap(`<h3>Seguimiento #AF-1050</h3><div class="highlight ${!state.paymentConfirmed?'warning':''}">${state.paymentConfirmed?'¡Pago confirmado! Tu pedido está en proceso.':'Recibimos tu comprobante. El restaurante está verificando el pago.'}</div><div class="steps">${labels.map((l,i)=>`<div class="step ${i<stage?'done':''}"><div class="step-num">${i<stage?'✓':i+1}</div><div><strong>${l}</strong><p>${i===0?'Solicitud registrada':i===1?'El negocio comprueba su banco':i===2?'Cocina prepara el almuerzo':i===3?'Sale hacia tu dirección':'Pedido recibido en destino'}</p></div></div>`).join('')}</div><div class="notice">${ico('pin')}<div><strong>Entrega: domicilio u oficina</strong><p>${escapeHtml(state.address)}</p></div></div>`) }
function clientProfile(){return clientWrap(`<h3>Mi perfil</h3><div class="field" style="margin-bottom:14px"><label>Nombre de cliente</label><input class="input" value="Cliente demo"></div><div class="field" style="margin-bottom:14px"><label>Código único de cliente</label><input class="input" value="EL-SABOR-0001" disabled></div><div class="field" style="margin-bottom:14px"><label>PIN (acceso protegido por servidor)</label><input type="password" class="input" value="******" disabled></div><div class="field"><label>Dirección habitual</label><textarea class="input">${escapeHtml(state.address)}</textarea></div><p class="footnote">En la versión real, el nombre no bastará para entrar. Se utilizará un identificador único y un PIN protegido mediante hash, con control de intentos.</p>`)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),4500)}
function selectDay(d){state.day=d;render()}
function chooseFood(id){state.selectedFood=id;render()}
function checkoutNext(){const el=document.getElementById('clientAddress');state.address=(el?.value||'').trim();if(state.address.length<8){toast('Introduce una dirección válida antes del pago.');return}state.zone=document.getElementById('clientZone')?.value||'centro';go('pay')}
function receiptChosen(el){let f=el.files?.[0];if(!f)return;if(!['application/pdf','image/png','image/jpeg'].includes(f.type)||f.size>5*1024*1024){el.value='';state.receiptName='';toast('Usa PDF, JPG o PNG de hasta 5 MB.');return}state.receiptName=f.name;toast('Archivo seleccionado sólo para la demo. No se ha subido.');}
function submitReceipt(){if(!state.receiptName){toast('Selecciona un comprobante antes de enviar el pedido.');return}state.orderCreated=true;state.paymentConfirmed=false;state.prepared=false;state.delivered=false;go('tracking');toast('Pedido de DEMOSTRACIÓN enviado para revisión (sin conexión real).')}
function verifyPayment(){if(!state.orderCreated){toast('No hay pedido demo para confirmar.');return}state.paymentConfirmed=true;render();toast('Pago marcado como confirmado sólo en la demo, sin consultar el banco.')}
function go(p){state.page=p;writeRoute();render();window.scrollTo({top:0,behavior:'smooth'})}
function changeRole(role){state.role=role;state.page='home';state.day=0;writeRoute();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.body.classList.toggle('role-cliente',state.role==='cliente');let nav=navs[state.role];document.querySelectorAll('[data-role]').forEach(el=>el.classList.toggle('selected',el.dataset.role===state.role));document.getElementById('sideTitle').textContent=state.role==='faro'?'Plataforma':state.role==='restaurante'?'Operación':'Mi cuenta';document.getElementById('nav').innerHTML=nav.map(([ic,label,page])=>`<button class="${state.page===page?'active':''}" onclick="go('${page}')">${ico(ic)}<span>${label}</span></button>`).join('');const name=nav.find(([i,l,p])=>p===state.page)?.[1]||'Detalle de pedido';document.getElementById('crumb').textContent=state.role==='faro'?'Apps Faro · '+name:state.role==='restaurante'?'Restaurante · '+name:'Cliente · '+name;let view;if(state.role==='faro')view=({home:faroHome,apps:faroApps,businesses:faroBusinesses,subscriptions:faroSubscriptions,analytics:faroAnalytics,support:faroGeneric,settings:faroGeneric})[state.page]?.()||faroHome();else if(state.role==='restaurante')view=({home:restaurantHome,menu:restaurantMenu,orders:restaurantOrders,payments:restaurantPayments,kitchen:restaurantKitchen,deliveries:restaurantDeliveries,customers:restaurantCustomers,reports:restaurantReports,settings:restaurantSettings})[state.page]?.()||restaurantHome();else view=({home:clientHome,week:clientWeek,orders:clientOrders,payments:clientPayments,profile:clientProfile,checkout:clientCheckout,pay:clientPay,tracking:clientTracking})[state.page]?.()||clientHome();document.getElementById('view').innerHTML=view+`<p class="footnote">Restaurantes by Apps Faro · Prototipo V1.0 · Todos los datos son ilustrativos. No procesa transferencias, guarda archivos ni consulta Firebase.</p>`;}
function writeRoute(){let url='#/'+state.role+'/'+state.page;if(location.hash!==url)history.pushState(null,'',url)}
function readRoute(){let m=location.hash.match(/^#\/(faro|restaurante|cliente)(?:\/([a-z-]+))?$/);if(!m)return;let role=m[1],page=m[2]||'home',valid=navs[role].some(a=>a[2]===page)||(role==='cliente'&&['checkout','pay','tracking'].includes(page));state.role=role;state.page=valid?page:'home'}
document.querySelectorAll('[data-role]').forEach(btn=>btn.addEventListener('click',()=>changeRole(btn.dataset.role)));
window.addEventListener('popstate',()=>{readRoute();render()});
window.addEventListener('hashchange',()=>{readRoute();render()});
readRoute();render();
</script>
</body>
</html>
