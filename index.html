<title>Restaurantes | Apps Faro</title>
<style>
:root{--dark:#0c1c2e;--dark2:#132e43;--mint:#1ac7a6;--ink:#1c2e41;--muted:#708296;--line:#e3ebf1;--bg:#f4f7fa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}html,body{margin:0;min-height:100%}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #2ad8b7;outline-offset:3px}h1,h2,h3,p{margin:0}small{font-size:12px}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:none;background:var(--dark);color:#fff;display:flex;flex-direction:column;padding:28px 17px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:850;letter-spacing:.02em;display:flex;align-items:center;gap:12px;padding:4px 10px 28px}.brand span{display:grid;place-items:center;background:linear-gradient(130deg,#61f7ce,#5299fd);width:38px;height:38px;border-radius:12px;color:#102f36}.brand small{display:block;letter-spacing:.18em;font-size:9px;color:#87a8be;margin-top:3px}.side-label{padding:12px;color:#65869d;font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:800}.nav{display:grid;gap:5px}.nav a{font-size:13px;font-weight:650;color:#b5c5d3;padding:13px 15px;border-radius:12px}.nav a:hover,.nav a.active{background:#204353;color:#9df6db}.sidefoot{margin-top:auto;border-top:1px solid #294154;padding:16px 12px 0;color:#8daabc;font-size:11px;line-height:1.65}.sidefoot button{background:transparent;color:#9df6db;padding:0;border:0;font-size:12px}.main{width:100%;min-width:0}.top{height:76px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.top small{color:var(--muted)}.content{max-width:1370px;padding:33px 34px 80px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:24px}.overline{text-transform:uppercase;font-size:10px;letter-spacing:.16em;color:#15977e;font-weight:850;margin-bottom:8px}h1{font-size:clamp(23px,3vw,32px);letter-spacing:-.045em}h2{font-size:18px;letter-spacing:-.03em}h3{font-size:14px}.sub{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:19px}.card{background:white;border:1px solid #e4ecf3;border-radius:18px;padding:21px;box-shadow:0 10px 40px #1b405008}.card h2{margin-bottom:13px}.card .value{font-size:29px;font-weight:850;letter-spacing:-.05em}.card .caption{color:var(--muted);font-size:12px}.columns{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.stack{display:grid;gap:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.muted{color:var(--muted)}.tag{display:inline-block;font-size:10px;border-radius:100px;background:#e4f9f1;color:#087c62;padding:6px 9px;font-weight:800}.tag.warning{background:#fff4dc;color:#99620d}.tag.danger{background:#fff0ed;color:#af554b}.tag.dark{background:#eaf0f5;color:#516b81}.button{border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:#142b44;color:#fff;font-weight:750;font-size:12px;min-height:40px}.button:hover{filter:brightness(1.08)}.button.primary{background:var(--mint);color:#073e39}.button.light{background:#eff5f9;color:#25445a}.button.danger{background:#fff0ed;color:#a14036}.button.small{padding:8px 10px;min-height:31px;font-size:11px}.form{display:grid;gap:15px}.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px}.field label{font-size:12px;color:#45576b;font-weight:750}.field input,.field select,.field textarea{border:1px solid #d8e4ed;padding:12px 13px;min-height:44px;width:100%;border-radius:11px;background:#fff;color:#192b3c;font-size:13px}.field textarea{resize:vertical;min-height:90px}.hint{font-size:11px;line-height:1.6;color:var(--muted)}.hint strong{color:#365364}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th,td{padding:13px 10px;border-bottom:1px solid #edf1f6;vertical-align:middle}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8291a0}tr:last-child td{border:0}.notice{background:#e8faf3;color:#28695a;border:1px solid #cbf1e3;padding:15px 17px;border-radius:13px;font-size:13px;line-height:1.6;margin-bottom:20px}.notice.warn{color:#865b15;background:#fff8e5;border-color:#f4e2b7}.notice.error{color:#a03b30;background:#fff0ed;border-color:#f7cfc8}.navlinks{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:23px}.navlinks button{font-size:12px;color:#5d778b;background:white;border:1px solid var(--line);border-radius:9px;padding:10px 13px}.navlinks button.current{background:#173f46;color:#e0fff6}.login{max-width:490px;margin:70px auto;padding:32px}.loginhead{display:grid;gap:8px;margin-bottom:27px}.loginhead h1{font-size:29px}.role-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.role-tabs a{padding:9px 12px;border-radius:10px;background:#e9f0f5;color:#556b7c;font-weight:750;font-size:12px}.role-tabs a.active{background:#163e49;color:white}.empty{padding:28px;border:1px dashed #cad8e0;border-radius:13px;color:#6e8191;font-size:13px;text-align:center}.food-item{display:flex;align-items:center;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.food-item:last-child{border:0}.food-avatar{width:50px;height:50px;display:grid;place-items:center;font-size:26px;border-radius:14px;background:#e8f8ee}.food-body{flex:1;min-width:0}.food-body b{display:block;font-size:14px}.food-body small{display:block;margin-top:5px;color:#8391a1}.mobile-actions{display:none}.client-layout{max-width:980px;margin:auto}.client-hero{background:linear-gradient(120deg,#103d41,#0f263b);color:#fff;border-radius:20px;padding:30px;display:flex;align-items:center;gap:21px;margin-bottom:20px}.client-hero h1{color:#fff;margin-bottom:7px}.client-hero p{font-size:12px;color:#afcfd4;line-height:1.5}.logo{width:75px;height:75px;object-fit:cover;border-radius:17px;background:#fff}.divide{border:0;border-top:1px solid var(--line);margin:16px 0}.smallnote{font-size:11px;color:#7c90a3;line-height:1.65}.status{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e9f0f4;font-size:12px}.status:last-child{border:0}.status b{margin-left:auto}.spinner{display:inline-block;width:17px;height:17px;border:2px solid #c7dce0;border-top-color:#16ab8d;border-radius:100%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1030px){.cards{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:760px){.layout{display:block}.sidebar{width:100%;height:auto;position:static;padding:14px 16px}.brand{padding:2px}.side-label,.nav,.sidefoot{display:none}.top{height:57px;padding:0 16px}.content{padding:23px 16px 85px}.cards{gap:10px}.card{padding:16px}.card .value{font-size:23px}.cols2{grid-template-columns:1fr}.hero{align-items:start}.login{margin:22px auto;padding:22px}.mobile-actions{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:7;background:#10283a;color:#c7dce0;padding:10px 8px;justify-content:flex-start;gap:5px;overflow-x:auto}.mobile-actions a{font-size:11px;padding:8px 10px;text-align:center;flex:0 0 auto;white-space:nowrap}.mobile-actions a.active{color:#70efd0}.client-hero{padding:18px;gap:12px}.logo{width:56px;height:56px}}
</style>
</head>
<body><div id="app"></div>
<script>
'use strict';
const APP=document.getElementById('app');
const H=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);
const priceValue=v=>Math.round((Number(String(v).replace(',','.'))||0)*100);
const goodDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Guayaquil',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const ecuadorHour=()=>new Intl.DateTimeFormat('en-GB',{timeZone:'America/Guayaquil',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());
const currentCutoff=(restaurant,date)=>restaurant.cutoffs?.[new Date(date+'T12:00:00Z').getUTCDay()]||restaurant.cutoff||'11:00';
const dateLabel=x=>goodDate(x)?new Date(x+'T12:00:00').toLocaleDateString('es-EC',{weekday:'short',day:'numeric',month:'short'}):x;
const nav={faro:[['home','Resumen'],['businesses','Negocios y suscripciones'],['subscriptions','Renovaciones'],['analytics','Rendimiento']],restaurante:[['home','Resumen'],['menu','Menús semanales'],['orders','Pedidos y pagos'],['payments','Conciliación'],['deliveries','Entregas'],['clients','Clientes'],['settings','Configuración']],cliente:[['home','Menú'],['orders','Mis pedidos'],['profile','Mi cuenta']]};
const state={api:localStorage.getItem('appsfaro_api')||(location.hostname==='appsfaro.github.io'?'':location.origin),token:sessionStorage.getItem('appsfaro_session')||'',user:JSON.parse(sessionStorage.getItem('appsfaro_user')||'null'),slug:localStorage.getItem('appsfaro_slug')||new URLSearchParams(location.search).get('r')||'',role:'restaurante',page:'home',setup:false,register:false,orders:[],payments:[],subscriptionPayments:[],analytics:null,menus:[],reservation:JSON.parse(sessionStorage.getItem('appsfaro_reservation')||'null'),restaurant:null,restaurants:[],customers:[],message:'',error:'',loading:false,day:today(),selectedOption:null};
function route(){let match=location.hash.match(/^#\/(faro|restaurante|cliente)(?:\/([a-z-]+))?/);if(match){state.role=match[1];state.page=match[2]||'home'}else{state.role='restaurante';state.page='home'}}
function goto(role,page='home'){state.role=role;state.page=page;location.hash='#/'+role+'/'+page;state.error='';state.message='';render()}
function notify(message,isError=false){state.error=isError?message:'';state.message=isError?'':message;render()}
const F=(name,label,type='text',value='',extra='')=>`<div class="field"><label for="${H(name)}">${label}</label><input id="${H(name)}" name="${H(name)}" type="${type}" value="${H(value)}" ${extra}></div>`;
const textarea=(name,label,value='',rows=3)=>`<div class="field"><label for="${H(name)}">${label}</label><textarea id="${H(name)}" name="${H(name)}" rows="${rows}">${H(value)}</textarea></div>`;
const sel=(name,label,values,chosen)=>`<div class="field"><label>${label}</label><select name="${H(name)}">${values.map(([v,l])=>`<option value="${H(v)}" ${chosen===v?'selected':''}>${H(l)}</option>`).join('')}</select></div>`;
const button=(label,action,kind='light',extra='')=>`<button class="button ${kind}" type="button" data-action="${action}" ${extra}>${label}</button>`;
function formData(form){const f=new FormData(form);return Object.fromEntries([...f.entries()].filter(([,v])=>typeof v==='string'))}
function intro(title,sub='',action=''){return `<div class="hero"><div><div class="overline">Restaurantes · Apps Faro</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${action}</div>`}
async function api(path,opts={}){if(!state.api)throw Error('Falta configurar la dirección de la API');let url=state.api.replace(/\/+$/,'')+path;const headers={'content-type':'application/json'};if(state.token)headers.authorization='Bearer '+state.token;let res;try{res=await fetch(url,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined,cache:'no-store'})}catch{throw Error('No se puede contactar con el servidor. Comprueba la URL de la API.')}let data=await res.json().catch(()=>({}));if(!res.ok){if(res.status===401&&path!=='/api/login'){signout(false)}throw Error(data.error||'Ocurrió un error en el servidor')}return data}
function signout(update=true){state.token='';state.user=null;sessionStorage.removeItem('appsfaro_session');sessionStorage.removeItem('appsfaro_user');if(update)render()}
async function login(payload){const r=await api('/api/login',{method:'POST',body:payload});state.token=r.token;state.user=r.user;sessionStorage.setItem('appsfaro_session',r.token);sessionStorage.setItem('appsfaro_user',JSON.stringify(r.user));if(r.user.restaurantId){state.slug=r.user.restaurantId;localStorage.setItem('appsfaro_slug',state.slug)}await refresh();render()}
function connected(){return !!state.api}
function menu(role=state.role){return nav[role].map(([p,title])=>`<a href="#/${role}/${p}" class="${state.page===p?'active':''}">${H(title)}</a>`).join('')}
function layout(content){const roleName=state.role==='faro'?'Apps Faro':state.role==='restaurante'?'Restaurante':'Cliente';return `<div class="layout"><aside class="sidebar"><div class="brand"><span>◈</span><div>APPS FARO<small>RESTAURANTES</small></div></div><div class="side-label">${H(roleName)}</div><nav class="nav">${menu()}</nav><div class="sidefoot">${H(state.user?.name||state.user?.username||'')}<br>${H(state.user?.restaurantId||'Administración')}<br><button data-action="logout">Cerrar sesión</button></div></aside><main class="main"><div class="top"><div><b>${H(roleName)}</b> <small>/ ${H(nav[state.role]?.find(x=>x[0]===state.page)?.[1]||'Inicio')}</small></div><div class="row"><span class="tag">Sistema operativo</span>${button('Salir','logout','light')}</div></div><div class="content">${state.message?`<div class="notice">${H(state.message)}</div>`:''}${state.error?`<div class="notice error">${H(state.error)}</div>`:''}${content}</div></main><div class="mobile-actions">${nav[state.role].map(([p,l])=>`<a class="${state.page===p?'active':''}" href="#/${state.role}/${p}">${H(l)}</a>`).join('')}</div></div>`}
function configScreen(){return `<div class="login card"><div class="loginhead"><div class="overline">Puesta en marcha</div><h1>Conectar el servidor</h1><p class="sub">GitHub Pages ya publica las pantallas. Para registrar clientes y pedidos reales, primero es necesario desplegar la API segura vinculada a Firebase.</p></div>${state.error?`<div class="notice error">${H(state.error)}</div>`:''}<form id="api-form" class="form">${F('apiUrl','URL HTTPS del servidor de Apps Faro','url',state.api,'required placeholder="https://restaurantes-api.tu-cuenta.workers.dev"')}<button class="button primary" type="submit">Conectar y comprobar</button></form><p class="hint" style="margin-top:17px">La URL pública de la API no es un secreto. No ingreses aquí credenciales de Firebase ni claves privadas.</p><div class="notice warn" style="margin-top:17px">La instalación del servidor es obligatoria para funcionar con datos reales. Revisa <strong>CONFIGURACION.md</strong> en el repositorio.</div>${button('Ver configuración de GitHub','repo','light')}</div>`}
function loginScreen(){const role=state.role;const roleOptions=[['faro','Apps Faro'],['restaurante','Restaurante'],['cliente','Cliente']].map(([v,l])=>`<a class="${role===v?'active':''}" href="#/${v}/home">${l}</a>`).join('');let form='';if(role==='cliente')form=`${F('restaurantId','Código del restaurante','text',state.slug,'required minlength="3"')}${F('username','Teléfono','tel','','required inputmode="numeric"')}${F('password','PIN de 6 a 8 dígitos','password','','required minlength="6" maxlength="8"')}`;else form=`${role==='restaurante'?F('restaurantId','Código del restaurante','text',state.slug,'required'):''}${F('username','Usuario','text','','required autocomplete="username"')}${F('password','Contraseña','password','','required autocomplete="current-password"')}`;
return `<div class="login card"><div class="loginhead"><div class="overline">Restaurantes by Apps Faro</div><h1>${role==='faro'?'Administración general':role==='restaurante'?'Gestiona tu restaurante':'Pide tu almuerzo'}</h1><p class="sub">${role==='cliente'?'Ingresa con tu teléfono y PIN.':'Accede con tus credenciales autorizadas.'}</p></div><div class="role-tabs">${roleOptions}</div>${state.error?`<div class="notice error">${H(state.error)}</div>`:''}${state.message?`<div class="notice">${H(state.message)}</div>`:''}<form id="login-form" class="form">${form}<button class="button primary" type="submit">Entrar al sistema</button></form>${role==='cliente'?`<div class="row wrap" style="margin-top:15px">${button('Crear mi cuenta','register','light')}${button('Ver menú sin ingresar','public-menu','light')}</div>`:role==='faro'?`<div style="margin-top:17px">${button('Primera instalación','bootstrap','light')}</div>`:''}<div style="margin-top:19px">${button('Cambiar servidor','change-api','light')}</div></div>`}
function setupScreen(){return `<div class="login card"><h1>Crear administrador Apps Faro</h1><p class="sub">Solo se admite una instalación inicial y necesitas el código secreto configurado en el servidor.</p>${state.error?`<div class="notice error">${H(state.error)}</div>`:''}<form id="bootstrap-form" class="form" style="margin-top:23px">${F('setupToken','Código de instalación','password','','required')}${F('name','Nombre del administrador','text','Administrador Apps Faro','required')}${F('username','Usuario','text','','required minlength="4"')}${F('password','Contraseña segura (mínimo 12 caracteres)','password','','required minlength="12"')}<button class="button primary" type="submit">Crear administrador</button></form><div style="margin-top:16px">${button('Volver al inicio','back','light')}</div></div>`}
function registerScreen(){return `<div class="login card"><h1>Crear cuenta de cliente</h1><p class="sub">Tu restaurante debe estar registrado en Apps Faro. El PIN se guarda protegido en el servidor.</p>${state.error?`<div class="notice error">${H(state.error)}</div>`:''}<form id="register-form" class="form" style="margin-top:23px">${F('restaurantId','Código del restaurante','text',state.slug,'required')}${F('name','Nombre completo','text','','required')}${F('phone','Número de teléfono','tel','','required')}${F('pin','Crea un PIN de 6 a 8 números','password','','required pattern="[0-9]{6,8}"')}${textarea('address','Dirección de entrega habitual','',2)}<button type="submit" class="button primary">Crear cuenta</button></form><div style="margin-top:16px">${button('Ya tengo cuenta','back','light')}</div></div>`}
function kpi(value,title){return `<div class="card"><div class="value">${H(value)}</div><div class="caption">${H(title)}</div></div>`}
function faroHome(){const r=state.restaurants;return `${intro('Control general','Actividad y suscripciones de tus negocios.',`<a href="#/faro/businesses" class="button primary">Administrar negocios</a>`)}<div class="cards">${kpi(r.length,'Restaurantes registrados')}${kpi(r.filter(x=>x.active&&x.subscriptionUntil>=today()).length,'Suscripciones vigentes')}${kpi(r.filter(x=>!x.active||x.subscriptionUntil<today()).length,'Suspendidos o vencidos')}${kpi('—','Ingresos (a integrar con pagos)')}</div><div class="card"><h2>Restaurantes registrados</h2>${businessTable(r)}</div>`}
function businessTable(r){if(!r.length)return `<div class="empty">Todavía no hay restaurantes. Crea el primero desde Negocios.</div>`;return `<div class="table-scroll"><table><thead><tr><th>Restaurante</th><th>Código</th><th>Estado</th><th>Vencimiento</th><th>Acciones</th></tr></thead><tbody>${r.map(x=>`<tr><td><b>${H(x.name)}</b></td><td>${H(x.slug)}</td><td><span class="tag ${x.active&&x.subscriptionUntil>=today()?'':'warning'}">${x.active&&x.subscriptionUntil>=today()?'Activo':'Suspendido / vencido'}</span></td><td><input aria-label="Vencimiento" type="date" data-date="${H(x.slug)}" value="${H(x.subscriptionUntil||today())}"></td><td><button data-action="save-business" data-slug="${H(x.slug)}" class="button small light">Guardar fecha</button> <button data-action="toggle-business" data-slug="${H(x.slug)}" class="button small ${x.active?'danger':'primary'}">${x.active?'Suspender':'Activar'}</button></td></tr>`).join('')}</tbody></table></div>`}
function faroBusinesses(){return `${intro('Negocios y suscripciones','Crea y administra los restaurantes que utilizan Apps Faro.')}<div class="columns"><div class="card"><h2>Restaurantes</h2><div style="margin-top:18px">${businessTable(state.restaurants)}</div></div><div class="card"><h2>Agregar restaurante</h2><form id="business-form" class="form" style="margin-top:19px">${F('name','Nombre comercial','text','','required')}${F('slug','Código único (para el cliente)','text','','required pattern="[a-z0-9_-]{3,40}" placeholder="el-sabor"')}${F('ownerUsername','Usuario del propietario','text','','required minlength="4"')}${F('ownerPassword','Contraseña inicial del propietario','password','','required minlength="12"')}${F('subscriptionUntil','Vigencia de la suscripción','date',today(),'required')}<button type="submit" class="button primary">Registrar negocio</button></form><p class="hint" style="margin-top:14px">Comparte el código y las credenciales con el propietario por un canal privado. No se mostrarán nuevamente las contraseñas.</p></div></div>`}
function faroSubscriptions(){
 const rows=state.subscriptionPayments||[];
 return intro('Renovaciones de Apps Faro','Los cobros a restaurantes son independientes de los pagos por almuerzos.')+
 '<div class="columns"><div class="card"><h2>Historial de suscripciones</h2>'+
 (rows.length?'<div class="table-scroll"><table><thead><tr><th>Negocio</th><th>Monto</th><th>Referencia</th><th>Válido hasta</th></tr></thead><tbody>'+
 rows.map(x=>'<tr><td>'+H(x.restaurantId)+'</td><td>'+money(x.amountCents)+'</td><td>'+H(x.reference)+'</td><td>'+H(x.validThrough)+'</td></tr>').join('')+
 '</tbody></table></div>':empty('No hay pagos de suscripción registrados.'))+'</div>'+
 '<div class="card"><h2>Registrar renovación recibida</h2><form id="subscription-form" class="form">'+
 sel('restaurantId','Restaurante',state.restaurants.map(x=>[x.slug,x.name]),'')+
 F('amount','Monto recibido en USD','number','15','required step="0.01" min="0.01"')+
 F('reference','Referencia verificada del pago','text','','required minlength="5"')+
 F('validThrough','Nueva fecha de vencimiento','date','','required')+
 '<button class="button primary" type="submit">Registrar pago y renovar</button></form>'+
 '<p class="hint">Verifica primero el dinero en tu cuenta; el sistema no está conectado a un banco.</p></div></div>';
}
function faroAnalytics(){
 const data=state.analytics||{},f=data.figures||[];

async function fileData(file,limit){if(!file)throw Error('Debes seleccionar un archivo');if(file.size>limit)throw Error('Archivo demasiado grande. El límite es '+Math.ceil(limit/1024)+' KB.');return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result));fr.onerror=()=>reject(Error('No se pudo leer el archivo'));fr.readAsDataURL(file)})}
async function logoData(file){if(!file||!file.size)return state.restaurant?.logo||'';if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('Solo imágenes para el logo');if(file.size>4*1024*1024)throw Error('La imagen del logo supera 4 MB');const src=await fileData(file,4*1024*1024);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Logo inválido'));img.src=src});const canvas=document.createElement('canvas');canvas.width=180;canvas.height=180;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,180,180);const scale=Math.min(180/img.width,180/img.height);ctx.drawImage(img,(180-img.width*scale)/2,(180-img.height*scale)/2,img.width*scale,img.height*scale);return canvas.toDataURL('image/jpeg',.72)}
async function receiptFile(file){if(!file)throw Error('Debes subir el comprobante');const valid=['image/jpeg','image/png','image/webp','application/pdf'];if(!valid.includes(file.type))throw Error('Formato de comprobante inválido');if(file.type==='application/pdf'){const s=await fileData(file,400*1024);return {name:file.name,mime:file.type,base64:s.split(',')[1]}}const s=await fileData(file,5*1024*1024);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Imagen de comprobante inválida'));img.src=s});const max=1200,ratio=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.floor(img.width*ratio);c.height=Math.floor(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.65);if(data.length>560000)data=c.toDataURL('image/jpeg',.38);if(data.length>560000)throw Error('El comprobante es demasiado grande; utiliza una imagen más pequeña');return{name:file.name,mime:'image/jpeg',base64:data.split(',')[1]}}
document.addEventListener('submit',async ev=>{const form=ev.target;if(!['api-form','login-form','bootstrap-form','register-form','business-form','menu-form','settings-form','subscription-form','account-form','quote-form','proof-form'].includes(form.id))return;ev.preventDefault();const submit=form.querySelector('[type="submit"]');if(submit)submit.disabled=true;try{const d=formData(form);state.error='';state.message='';if(form.id==='api-form'){const url=d.apiUrl.trim().replace(/\/+$/,'');if(!/^https:\/\//.test(url)&&!/^http:\/\/localhost/.test(url))throw Error('La API debe utilizar HTTPS');state.api=url;const health=await api('/api/health');if(!health.firestoreConfigured)throw Error('La API está activa, pero todavía falta configurar las credenciales privadas de Firestore');localStorage.setItem('appsfaro_api',url);notify('Servidor conectado. Ahora puedes iniciar sesión.');return}
if(form.id==='login-form'){if(d.restaurantId){state.slug=d.restaurantId.toLowerCase();localStorage.setItem('appsfaro_slug',state.slug)}await login({role:{faro:'platform',restaurante:'owner',cliente:'customer'}[state.role],restaurantId:state.slug,username:d.username,password:d.password});return}
if(form.id==='bootstrap-form'){await api('/api/bootstrap',{method:'POST',body:d});state.setup=false;notify('Administrador creado. Inicia sesión.');return}
if(form.id==='register-form'){state.slug=d.restaurantId.toLowerCase();localStorage.setItem('appsfaro_slug',state.slug);await api('/api/register',{method:'POST',body:{restaurantId:state.slug,...d}});state.register=false;await login({role:'customer',restaurantId:state.slug,username:d.phone,password:d.pin});return}
if(form.id==='business-form'){await api('/api/admin/restaurants',{method:'POST',body:d});await refresh();notify('Restaurante registrado. Entrega las credenciales al propietario de forma privada.');return}
if(form.id==='menu-form'){const parseLines=(value,kind)=>String(value||'').split(/\r?\n/).filter(Boolean).map(line=>{const i=line.lastIndexOf('|');if(i<1)throw Error('Cada plato necesita nombre | precio');return{name:line.slice(0,i).trim(),priceCents:priceValue(line.slice(i+1)),kind}});const rows=[...parseLines(d.options,'regular'),...parseLines(d.specials,'special')];const body={date:d.date,soup:d.soup,options:rows,published:form.elements.namedItem('published').checked};await api('/api/menus',{method:'PUT',body});state.day=d.date;await refresh();notify('Menú guardado en Firestore.');return}
if(form.id==='settings-form'){const logo=await logoData(form.elements.namedItem('logo').files[0]);const zones=d.zones.split(/\r?\n/).filter(Boolean).map(line=>{const i=line.lastIndexOf('|');if(i<1)throw Error('Zona inválida: escribe nombre | precio');return{name:line.slice(0,i).trim(),priceCents:priceValue(line.slice(i+1))}});const cutoffs=Object.fromEntries(Array.from({length:7},(_,day)=>[String(day),d['cutoff_'+day]]).filter(([,time])=>time));const body={name:d.name,phone:d.phone,address:d.address,primary:d.primary,logo,cutoff:d.cutoff,cutoffs,bank:{bank:d.bankName,owner:d.bankOwner,account:d.bankAccount,type:d.bankType},shipping:{mode:d.shippingMode,fixedCents:priceValue(d.fixedCents),zones}};await api('/api/restaurant',{method:'PATCH',body});await refresh();notify('Configuración guardada correctamente.');return}
if(form.id==='subscription-form'){
 const result=await api('/api/admin/subscription-payments',{method:'POST',
   body:{restaurantId:d.restaurantId,amountCents:priceValue(d.amount),reference:d.reference,validThrough:d.validThrough}});
 await refresh();notify('Renovación registrada hasta '+result.validThrough);return
}
if(form.id==='account-form'){
 await api('/api/account/change-secret',{method:'POST',body:{currentSecret:d.currentSecret,newSecret:d.newSecret}});
 signout(false);notify('PIN actualizado y sesiones anteriores revocadas. Inicia sesión de nuevo.');return
}
if(form.id==='quote-form'){
 const body={date:state.day,optionId:state.selectedOption,quantity:Number(d.quantity),address:d.address,zone:d.zone||'',notes:d.notes||''};
 const reservation=await api('/api/checkout/reservations',{method:'POST',body});
 state.reservation=reservation;sessionStorage.setItem('appsfaro_reservation',JSON.stringify(reservation));
 notify('Reserva creada. Ahora puedes transferir el importe exacto que aparece en pantalla.');return
}
if(form.id==='proof-form'){
 const booking=state.reservation;if(!booking?.id)throw Error('Antes debes crear la reserva y comprobar el total');
 const proof=await receiptFile(form.elements.namedItem('proof').files[0]);
 const record=await api('/api/checkout/reservations/'+encodeURIComponent(booking.id)+'/submit',
   {method:'POST',body:{proof,bankReference:d.bankReference||''}});
 state.reservation=null;sessionStorage.removeItem('appsfaro_reservation');
 await refresh();state.page='orders';location.hash='#/cliente/orders';
 notify('Pedido #'+record.id.slice(0,8)+' registrado. El restaurante debe verificar el depósito en su banco.');return
}
}catch(error){captureError(error)}finally{if(submit)submit.disabled=false}});
document.addEventListener('click',async ev=>{const btn=ev.target.closest('[data-action]');if(!btn)return;ev.preventDefault();const type=btn.dataset.action;try{
if(type==='logout'){signout();return}if(type==='change-api'){signout(false);state.api='';localStorage.removeItem('appsfaro_api');render();return}if(type==='bootstrap'){state.setup=true;render();return}if(type==='register'){state.register=true;render();return}if(type==='back'){state.setup=false;state.register=false;render();return}if(type==='repo'){window.open('https://github.com/Appsfaro/restaurante','_blank','noopener');return}if(type==='public-menu'){await guestMenu();return}if(type==='choose-date'){state.day=btn.dataset.date;render(!state.user);return}if(type==='choose-meal'){if(!state.user){notify('Inicia sesión o crea una cuenta para realizar un pedido.',true);return}state.reservation=null;sessionStorage.removeItem('appsfaro_reservation');state.day=btn.dataset.date;state.selectedOption=btn.dataset.option;state.page='checkout';location.hash='#/cliente/checkout';render();return}
if(type==='enable-notifications'){if(!('Notification' in window)){alert('Este navegador no admite notificaciones');return}const result=await Notification.requestPermission();notify(result==='granted'?'Notificaciones del navegador activadas.':'No se concedieron permisos para notificaciones.');return}
if(type==='copy-week'){
 const suggested=new Date((state.day||today())+'T12:00:00Z');
 const diff=(suggested.getUTCDay()+6)%7;suggested.setUTCDate(suggested.getUTCDate()-diff);
 const monday=prompt('Lunes de la nueva semana (AAAA-MM-DD). Se copiarán los menús de los siete días anteriores, sin publicarlos:',suggested.toISOString().slice(0,10));
 if(!monday)return;
 const result=await api('/api/menus/clone-week',{method:'POST',body:{weekStart:monday}});
 await refresh();notify('Se han copiado '+result.copied+' menús como borradores. Revisa sus precios antes de publicarlos.');return
}
if(type==='reset-pin'){
 if(!confirm('¿Ya verificaste la identidad del cliente por un medio externo? Su PIN anterior dejará de funcionar.'))return;
 const r=await api('/api/customers/'+encodeURIComponent(btn.dataset.id)+'/reset-pin',{method:'POST',body:{}});
 alert('Nuevo PIN provisional (se mostrará solo una vez): '+r.temporaryPin+'\nEntrégalo al cliente de forma privada.');
 await refresh();return
}
if(type==='new-reservation'){if(!confirm('Si ya transferiste, NO debes iniciar otro pago. ¿Confirmas que aún no has transferido?'))return;state.reservation=null;sessionStorage.removeItem('appsfaro_reservation');render();return}
if(type==='receipt'){const r=await api('/api/orders/'+encodeURIComponent(btn.dataset.id)+'/receipt');const raw=atob(r.base64);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);const objectURL=URL.createObjectURL(new Blob([out],{type:r.mime}));const a=document.createElement('a');a.href=objectURL;a.download=r.name||'comprobante';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectURL),30000);return}
if(type==='order-status'){
 const target=btn.dataset.status,order=state.orders.find(o=>o.id===btn.dataset.id);
 if(!order)throw Error('No se encontró el pedido');
 const body={status:target};
 if(target==='confirmed'){
  const reference=prompt('Revisa primero en tu banco que recibiste el dinero. Escribe el NÚMERO REAL DE OPERACIÓN bancaria confirmado:','');
  if(reference===null)return;
  const cents=prompt('Importe acreditado en tu banco (USD):',(Number(order.totalCents)/100).toFixed(2));
  if(cents===null)return;
  if(!/^\d{1,5}(?:[.,]\d{1,2})?$/.test(cents.trim()))throw Error('Introduce un importe bancario válido');
  body.bankReference=reference.trim();body.receivedCents=Math.round(Number(cents.replace(',','.'))*100);
  if(!confirm('¿Verificaste en la cuenta bancaria una transferencia de '+money(body.receivedCents)+' con referencia '+body.bankReference+'?'))return
 }else if(target==='rejected'||target==='refund_pending'){
  const why=prompt('Indica el motivo para conservarlo en el historial:','');if(why===null)return;body.reason=why.trim()
  }else if(target==='in_route'){
  const courier=prompt('Nombre de la persona que realizará la entrega:','');if(courier===null)return;body.deliveryPerson=courier.trim()
 }else if(target==='delivered'){
  const code=prompt('Pide al cliente su código de recepción de 6 números:','');if(code===null)return;body.deliveryCode=code.trim()
 }else if(target==='refunded'){
  const ref=prompt('Referencia bancaria de la devolución YA REALIZADA:','');if(ref===null)return;body.refundReference=ref.trim();
  body.refundCents=order.totalCents;
  if(!confirm('¿Has devuelto realmente '+money(order.totalCents)+' al cliente y comprobado el movimiento en el banco?'))return
 }else if(!confirm('¿Cambiar estado del pedido a '+(statuses[target]||target)+'?'))return;
 await api('/api/orders/'+encodeURIComponent(order.id)+'/status',{method:'PATCH',body});
 await refresh();notify('Cambio registrado en Firestore con historial de auditoría.');return
}
if(type==='save-business'||type==='toggle-business'){const r=state.restaurants.find(x=>x.slug===btn.dataset.slug);const date=document.querySelector('[data-date="'+btn.dataset.slug+'"]')?.value||r.subscriptionUntil;await api('/api/admin/restaurants/'+encodeURIComponent(r.slug),{method:'PATCH',body:{active:type==='toggle-business'?!r.active:r.active,subscriptionUntil:date}});await refresh();notify('Suscripción actualizada.');return}
}catch(error){captureError(error)}});
// Avisos mientras la aplicación permanezca abierta; no se envían mensajes externos.
setInterval(async()=>{
 if(!state.api||!state.token||!state.user||document.visibilityState!=='visible')return;
 if(document.activeElement?.closest?.('form'))return;
 const old=new Map(state.orders.map(o=>[o.id,o.status]));
 try{
  await refresh();
  const changed=state.orders.filter(o=>old.has(o.id)&&old.get(o.id)!==o.status);
  if(changed.length){
    state.message='Actualización: pedido #'+changed[0].id.slice(0,8)+' · '+(statuses[changed[0].status]||changed[0].status);
    if(window.Notification&&Notification.permission==='granted')new Notification('Restaurantes Apps Faro',{body:state.message});
  }
  render()
 }catch(error){console.warn('No se pudo sincronizar pedidos',error.message)}
},30000);
window.addEventListener('hashchange',async()=>{route();if(state.user){try{if(state.page==='clients'&&state.role==='restaurante')state.customers=await api('/api/customers');render()}catch(e){captureError(e)}}else render()});
(async()=>{route();if(state.api&&state.user){try{await refresh()}catch(error){state.error=error.message}}render()})();
</script></body></html>
