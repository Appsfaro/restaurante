<head>

<title>Restaurantes | Apps Faro</title>
<style>
:root{--dark:#0c1c2e;--dark2:#132e43;--mint:#1ac7a6;--ink:#1c2e41;--muted:#708296;--line:#e3ebf1;--bg:#f4f7fa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}html,body{margin:0;min-height:100%}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #2ad8b7;outline-offset:3px}h1,h2,h3,p{margin:0}small{font-size:12px}.layout{display:flex;min-height:100vh}.sidebar{width:248px;flex:none;background:var(--dark);color:#fff;display:flex;flex-direction:column;padding:28px 17px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:850;letter-spacing:.02em;display:flex;align-items:center;gap:12px;padding:4px 10px 28px}.brand span{display:grid;place-items:center;background:linear-gradient(130deg,#61f7ce,#5299fd);width:38px;height:38px;border-radius:12px;color:#102f36}.brand small{display:block;letter-spacing:.18em;font-size:9px;color:#87a8be;margin-top:3px}.side-label{padding:12px;color:#65869d;font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:800}.nav{display:grid;gap:5px}.nav a{font-size:13px;font-weight:650;color:#b5c5d3;padding:13px 15px;border-radius:12px}.nav a:hover,.nav a.active{background:#204353;color:#9df6db}.sidefoot{margin-top:auto;border-top:1px solid #294154;padding:16px 12px 0;color:#8daabc;font-size:11px;line-height:1.65}.sidefoot button{background:transparent;color:#9df6db;padding:0;border:0;font-size:12px}.main{width:100%;min-width:0}.top{height:76px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.top small{color:var(--muted)}.content{max-width:1370px;padding:33px 34px 80px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:24px}.overline{text-transform:uppercase;font-size:10px;letter-spacing:.16em;color:#15977e;font-weight:850;margin-bottom:8px}h1{font-size:clamp(23px,3vw,32px);letter-spacing:-.045em}h2{font-size:18px;letter-spacing:-.03em}h3{font-size:14px}.sub{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:19px}.card{background:white;border:1px solid #e4ecf3;border-radius:18px;padding:21px;box-shadow:0 10px 40px #1b405008}.card h2{margin-bottom:13px}.card .value{font-size:29px;font-weight:850;letter-spacing:-.05em}.card .caption{color:var(--muted);font-size:12px}.columns{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.stack{display:grid;gap:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.muted{color:var(--muted)}.tag{display:inline-block;font-size:10px;border-radius:100px;background:#e4f9f1;color:#087c62;padding:6px 9px;font-weight:800}.tag.warning{background:#fff4dc;color:#99620d}.tag.danger{background:#fff0ed;color:#af554b}.tag.dark{background:#eaf0f5;color:#516b81}.button{border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:#142b44;color:#fff;font-weight:750;font-size:12px;min-height:40px}.button:hover{filter:brightness(1.08)}.button.primary{background:var(--mint);color:#073e39}.button.light{background:#eff5f9;color:#25445a}.button.danger{background:#fff0ed;color:#a14036}.button.small{padding:8px 10px;min-height:31px;font-size:11px}.form{display:grid;gap:15px}.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px}.field label{font-size:12px;color:#45576b;font-weight:750}.field input,.field select,.field textarea{border:1px solid #d8e4ed;padding:12px 13px;min-height:44px;width:100%;border-radius:11px;background:#fff;color:#192b3c;font-size:13px}.field textarea{resize:vertical;min-height:90px}.hint{font-size:11px;line-height:1.6;color:var(--muted)}.hint strong{color:#365364}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th,td{padding:13px 10px;border-bottom:1px solid #edf1f6;vertical-align:middle}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8291a0}tr:last-child td{border:0}.notice{background:#e8faf3;color:#28695a;border:1px solid #cbf1e3;padding:15px 17px;border-radius:13px;font-size:13px;line-height:1.6;margin-bottom:20px}.notice.warn{color:#865b15;background:#fff8e5;border-color:#f4e2b7}.notice.error{color:#a03b30;background:#fff0ed;border-color:#f7cfc8}.navlinks{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:23px}.navlinks button{font-size:12px;color:#5d778b;background:white;border:1px solid var(--line);border-radius:9px;padding:10px 13px}.navlinks button.current{background:#173f46;color:#e0fff6}.login{max-width:490px;margin:70px auto;padding:32px}.loginhead{display:grid;gap:8px;margin-bottom:27px}.loginhead h1{font-size:29px}.role-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.role-tabs a{padding:9px 12px;border-radius:10px;background:#e9f0f5;color:#556b7c;font-weight:750;font-size:12px}.role-tabs a.active{background:#163e49;color:white}.empty{padding:28px;border:1px dashed #cad8e0;border-radius:13px;color:#6e8191;font-size:13px;text-align:center}.food-item{display:flex;align-items:center;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.food-item:last-child{border:0}.food-avatar{width:50px;height:50px;display:grid;place-items:center;font-size:26px;border-radius:14px;background:#e8f8ee}.food-body{flex:1;min-width:0}.food-body b{display:block;font-size:14px}.food-body small{display:block;margin-top:5px;color:#8391a1}.mobile-actions{display:none}.client-layout{max-width:980px;margin:auto}.client-hero{background:linear-gradient(120deg,#103d41,#0f263b);color:#fff;border-radius:20px;padding:30px;display:flex;align-items:center;gap:21px;margin-bottom:20px}.client-hero h1{color:#fff;margin-bottom:7px}.client-hero p{font-size:12px;color:#afcfd4;line-height:1.5}.logo{width:75px;height:75px;object-fit:cover;border-radius:17px;background:#fff}.divide{border:0;border-top:1px solid var(--line);margin:16px 0}.smallnote{font-size:11px;color:#7c90a3;line-height:1.65}.status{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e9f0f4;font-size:12px}.status:last-child{border:0}.status b{margin-left:auto}.spinner{display:inline-block;width:17px;height:17px;border:2px solid #c7dce0;border-top-color:#16ab8d;border-radius:100%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1030px){.cards{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:760px){.layout{display:block}.sidebar{width:100%;height:auto;position:static;padding:14px 16px}.brand{padding:2px}.side-label,.nav,.sidefoot{display:none}.top{height:57px;padding:0 16px}.content{padding:23px 16px 85px}.cards{gap:10px}.card{padding:16px}.card .value{font-size:23px}.cols2{grid-template-columns:1fr}.hero{align-items:start}.login{margin:22px auto;padding:22px}.mobile-actions{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:7;background:#10283a;color:#c7dce0;padding:10px 8px;justify-content:space-around;gap:5px}.mobile-actions a{font-size:11px;padding:8px 5px;text-align:center}.mobile-actions a.active{color:#70efd0}.client-hero{padding:18px;gap:12px}.logo{width:56px;height:56px}}
</style>
</head>
<body><div id="app"></div>
<script>
'use strict';
const APP=document.getElementById('app');
const H=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);
const priceValue=v=>Math.round((Number(String(v).replace(',','.'))||0)*100);
const goodDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Guayaquil',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dateLabel=x=>goodDate(x)?new Date(x+'T12:00:00').toLocaleDateString('es-EC',{weekday:'short',day:'numeric',month:'short'}):x;
const nav={faro:[['home','Resumen'],['businesses','Negocios y suscripciones']],restaurante:[['home','Resumen'],['menu','Menús semanales'],['orders','Pedidos y pagos'],['deliveries','Entregas'],['clients','Clientes'],['settings','Configuración']],cliente:[['home','Menú'],['orders','Mis pedidos'],['profile','Mi cuenta']]};
const state={api:localStorage.getItem('appsfaro_api')||'',token:sessionStorage.getItem('appsfaro_session')||'',user:JSON.parse(sessionStorage.getItem('appsfaro_user')||'null'),slug:localStorage.getItem('appsfaro_slug')||new URLSearchParams(location.search).get('r')||'',role:'restaurante',page:'home',setup:false,register:false,orders:[],menus:[],restaurant:null,restaurants:[],customers:[],message:'',error:'',loading:false,day:today(),selectedOption:null};
function route(){let match=location.hash.match(/^#\/(faro|restaurante|cliente)(?:\/([a-z-]+))?/);if(match){state.role=match[1];state.page=match[2]||'home'}else{state.role='restaurante';state.page='home'}}
function goto(role,page='home'){state.role=role;state.page=page;location.hash='#/'+role+'/'+page;state.error='';state.message='';render()}
function notify(message,isError=false){state.error=isError?message:'';state.message=isError?'':message;render()}
const F=(name,label,type='text',value='',extra='')=>`<div class="field"><label for="${H(name)}">${label}</label><input id="${H(name)}" name="${H(name)}" type="${type}" value="${H(value)}" ${extra}></div>`;
const textarea=(name,label,value='',rows=3)=>`<div class="field"><label for="${H(name)}">${label}</label><textarea id="${H(name)}" name="${H(name)}" rows="${rows}">${H(value)}</textarea></div>`;
const sel=(name,label,values,chosen)=>`<div class="field"><label>${label}</label><select name="${H(name)}">${values.map(([v,l])=>`<option value="${H(v)}" ${chosen===v?'selected':''}>${H(l)}</option>`).join('')}</select></div>`;
const button=(label,action,kind='light',extra='')=>`<button class="button ${kind}" type="button" data-action="${action}" ${extra}>${label}</button>`;
function formData(form){const f=new FormData(form);return Object.fromEntries([...f.entries()].filter(([,v])=>typeof v==='string'))}
function intro(title,sub='',action=''){return `<div class="hero"><div><div class="overline">Restaurantes · Apps Faro</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${action}</div>`}
async function api(path,opts={}){if(!state.api)throw Error('Falta configurar la dirección de la API');let url=state.api.replace(/\/+$/,'')+path;const headers={'content-type':'application/json'};if(state.token)headers.authorization='Bearer '+state.token;let res;try{res=await fetch(url,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined,cache:'no-store'})}catch{throw Error('No se puede contactar con el servidor. Comprueba la URL de la API.')}let data=await res.json().catch(()=>({}));if(!res.ok){if(res.status===401&&path!=='/api/login'){signout(false)}throw Error(data.error||'Ocurrió un error en el servidor')}return data}
function signout(update=true){state.token='';state.user=null;sessionStorage.removeItem('appsfaro_session');sessionStorage.removeItem('appsfaro_user');if(update)render()}
async function login(payload){const r=await api('/api/login',{method:'POST',body:payload});state.token=r.token;state.user=r.user;sessionStorage.setItem('appsfaro_session',r.token);sessionStorage.setItem('appsfaro_user',JSON.stringify(r.user));if(r.user.restaurantId){state.slug=r.user.restaurantId;localStorage.setItem('appsfaro_slug',state.slug)}await refresh();render()}
function connected(){return !!state.api}
function menu(role=state.role){return nav[role].map(([p,title])=>`<a href="#/${role}/${p}" class="${state.page===p?'active':''}">${H(title)}</a>`).join('')}
function layout(content){const roleName=state.role==='faro'?'Apps Faro':state.role==='restaurante'?'Restaurante':'Cliente';return `<div class="layout"><aside class="sidebar"><div class="brand"><span>◈</span><div>APPS FARO<small>RESTAURANTES</small></div></div><div class="side-label">${H(roleName)}</div><nav class="nav">${menu()}</nav><div class="sidefoot">${H(state.user?.name||state.user?.username||'')}<br>${H(state.user?.restaurantId||'Administración')}<br><button data-action="logout">Cerrar sesión</button></div></aside><main class="main"><div class="top"><div><b>${H(roleName)}</b> <small>/ ${H(nav[state.role]?.find(x=>x[0]===state.page)?.[1]||'Inicio')}</small></div><div class="row"><span class="tag">Sistema operativo</span>${button('Salir','logout','light')}</div></div><div class="content">${state.message?`<div class="notice">${H(state.message)}</div>`:''}${state.error?`<div class="notice error">${H(state.error)}</div>`:''}${content}</div></main><div class="mobile-actions">${nav[state.role].slice(0,4).map(([p,l])=>`<a class="${state.page===p?'active':''}" href="#/${state.role}/${p}">${H(l)}</a>`).join('')}</div></div>`}
function configScreen(){return `<div class="login card"><div class="loginhead"><div class="overline">Puesta en marcha</div><h1>Conectar el servidor</h1><p class="sub">GitHub Pages ya publica las pantallas. Para registrar clientes y pedidos reales, primero es necesario desplegar la API segura vinculada a Firebase.</p></div><form id="api-form" class="form">${F('apiUrl','URL HTTPS del servidor de Apps Faro','url',state.api,'required placeholder="https://restaurantes-api.tu-cuenta.workers.dev"')}<button class="button primary" type="submit">Conectar y comprobar</button></form><p class="hint" style="margin-top:17px">La URL pública de la API no es un secreto. No ingreses aquí credenciales de Firebase ni claves privadas.</p><div class="notice warn" style="margin-top:17px">La instalación del servidor es obligatoria para funcionar con datos reales. Revisa <strong>CONFIGURACION.md</strong> en el repositorio.</div>${button('Ver configuración de GitHub','repo','light')}</div>`}
function loginScreen(){const role=state.role;const roleOptions=[['faro','Apps Faro'],['restaurante','Restaurante'],['cliente','Cliente']].map(([v,l])=>`<a class="${role===v?'active':''}" href="#/${v}/home">${l}</a>`).join('');let form='';if(role==='cliente')form=`${F('restaurantId','Código del restaurante','text',state.slug,'required minlength="3"')}${F('username','Teléfono','tel','','required inputmode="numeric"')}${F('password','PIN de 6 a 8 dígitos','password','','required minlength="6" maxlength="8"')}`;else form=`${role==='restaurante'?F('restaurantId','Código del restaurante','text',state.slug,'required'):''}${F('username','Usuario','text','','required autocomplete="username"')}${F('password','Contraseña','password','','required autocomplete="current-password"')}`;
return `<div class="login card"><div class="loginhead"><div class="overline">Restaurantes by Apps Faro</div><h1>${role==='faro'?'Administración general':role==='restaurante'?'Gestiona tu restaurante':'Pide tu almuerzo'}</h1><p class="sub">${role==='cliente'?'Ingresa con tu teléfono y PIN.':'Accede con tus credenciales autorizadas.'}</p></div><div class="role-tabs">${roleOptions}</div>${state.error?`<div class="notice error">${H(state.error)}</div>`:''}${state.message?`<div class="notice">${H(state.message)}</div>`:''}<form id="login-form" class="form">${form}<button class="button primary" type="submit">Entrar al sistema</button></form>${role==='cliente'?`<div class="row wrap" style="margin-top:15px">${button('Crear mi cuenta','register','light')}${button('Ver menú sin ingresar','public-menu','light')}</div>`:role==='faro'?`<div style="margin-top:17px">${button('Primera instalación','bootstrap','light')}</div>`:''}<div style="margin-top:19px">${button('Cambiar servidor','change-api','light')}</div></div>`}
function setupScreen(){return `<div class="login card"><h1>Crear administrador Apps Faro</h1><p class="sub">Solo se admite una instalación inicial y necesitas el código secreto configurado en el servidor.</p>${state.error?`<div class="notice error">${H(state.error)}</div>`:''}<form id="bootstrap-form" class="form" style="margin-top:23px">${F('setupToken','Código de instalación','password','','required')}${F('name','Nombre del administrador','text','Administrador Apps Faro','required')}${F('username','Usuario','text','','required minlength="4"')}${F('password','Contraseña segura (mínimo 12 caracteres)','password','','required minlength="12"')}<button class="button primary" type="submit">Crear administrador</button></form><div style="margin-top:16px">${button('Volver al inicio','back','light')}</div></div>`}
function registerScreen(){return `<div class="login card"><h1>Crear cuenta de cliente</h1><p class="sub">Tu restaurante debe estar registrado en Apps Faro. El PIN se guarda protegido en el servidor.</p>${state.error?`<div class="notice error">${H(state.error)}</div>`:''}<form id="register-form" class="form" style="margin-top:23px">${F('restaurantId','Código del restaurante','text',state.slug,'required')}${F('name','Nombre completo','text','','required')}${F('phone','Número de teléfono','tel','','required')}${F('pin','Crea un PIN de 6 a 8 números','password','','required pattern="[0-9]{6,8}"')}${textarea('address','Dirección de entrega habitual','',2)}<button type="submit" class="button primary">Crear cuenta</button></form><div style="margin-top:16px">${button('Ya tengo cuenta','back','light')}</div></div>`}
function kpi(value,title){return `<div class="card"><div class="value">${H(value)}</div><div class="caption">${H(title)}</div></div>`}
function faroHome(){const r=state.restaurants;return `${intro('Control general','Actividad y suscripciones de tus negocios.',`<a href="#/faro/businesses" class="button primary">Administrar negocios</a>`)}<div class="cards">${kpi(r.length,'Restaurantes registrados')}${kpi(r.filter(x=>x.active&&x.subscriptionUntil>=today()).length,'Suscripciones vigentes')}${kpi(r.filter(x=>!x.active||x.subscriptionUntil<today()).length,'Suspendidos o vencidos')}${kpi('—','Ingresos (a integrar con pagos)')}</div><div class="card"><h2>Restaurantes registrados</h2>${businessTable(r)}</div>`}
function businessTable(r){if(!r.length)return `<div class="empty">Todavía no hay restaurantes. Crea el primero desde Negocios.</div>`;return `<div class="table-scroll"><table><thead><tr><th>Restaurante</th><th>Código</th><th>Estado</th><th>Vencimiento</th><th>Acciones</th></tr></thead><tbody>${r.map(x=>`<tr><td><b>${H(x.name)}</b></td><td>${H(x.slug)}</td><td><span class="tag ${x.active&&x.subscriptionUntil>=today()?'':'warning'}">${x.active&&x.subscriptionUntil>=today()?'Activo':'Suspendido / vencido'}</span></td><td><input aria-label="Vencimiento" type="date" data-date="${H(x.slug)}" value="${H(x.subscriptionUntil||today())}"></td><td><button data-action="save-business" data-slug="${H(x.slug)}" class="button small light">Guardar fecha</button> <button data-action="toggle-business" data-slug="${H(x.slug)}" class="button small ${x.active?'danger':'primary'}">${x.active?'Suspender':'Activar'}</button></td></tr>`).join('')}</tbody></table></div>`}
function faroBusinesses(){return `${intro('Negocios y suscripciones','Crea y administra los restaurantes que utilizan Apps Faro.')}<div class="columns"><div class="card"><h2>Restaurantes</h2><div style="margin-top:18px">${businessTable(state.restaurants)}</div></div><div class="card"><h2>Agregar restaurante</h2><form id="business-form" class="form" style="margin-top:19px">${F('name','Nombre comercial','text','','required')}${F('slug','Código único (para el cliente)','text','','required pattern="[a-z0-9_-]{3,40}" placeholder="el-sabor"')}${F('ownerUsername','Usuario del propietario','text','','required minlength="4"')}${F('ownerPassword','Contraseña inicial del propietario','password','','required minlength="12"')}${F('subscriptionUntil','Vigencia de la suscripción','date',today(),'required')}<button type="submit" class="button primary">Registrar negocio</button></form><p class="hint" style="margin-top:14px">Comparte el código y las credenciales con el propietario por un canal privado. No se mostrarán nuevamente las contraseñas.</p></div></div>`}
function restHome(){const orders=state.orders,menu=state.menus;return `${intro('Panel de restaurante',`${H(state.restaurant?.name||'')} · Operación de almuerzos a domicilio y oficinas.`)}<div class="cards">${kpi(orders.length,'Pedidos registrados')}${kpi(orders.filter(o=>o.status==='pending').length,'Comprobantes pendientes')}${kpi(orders.filter(o=>['confirmed','preparing','in_route','delivered'].includes(o.status)).length,'Pagos confirmados')}${kpi(money(orders.filter(o=>['confirmed','preparing','in_route','delivered'].includes(o.status)).reduce((a,o)=>a+o.totalCents,0)),'Ventas confirmadas')}</div><div class="columns"><div class="card"><div class="row"><h2>Pedidos recientes</h2><a href="#/restaurante/orders" class="button small light">Ver pedidos</a></div><div style="margin-top:15px">${orders.length?orderTable(orders.slice(0,6)):empty('Los pedidos aparecerán aquí cuando los clientes realicen compras.')}</div></div><div class="stack"><div class="card"><h2>Próximo cierre</h2><p class="sub">Los pedidos de hoy se cierran a las <b>${H(state.restaurant?.cutoff||'11:00')}</b> (hora de Ecuador).</p></div><div class="card"><h2>Menús publicados</h2><div class="value">${menu.filter(m=>m.published).length}</div><p class="sub">Días que los clientes pueden consultar y comprar.</p></div></div></div>`}
function empty(text){return `<div class="empty">${H(text)}</div>`}
function restMenu(){const selected=state.menus.find(m=>m.date===state.day)||{};const options=(selected.options||[]).map(x=>x.name+' | '+(x.priceCents/100).toFixed(2)).join('\n');return `${intro('Menú semanal','Publica sopas, segundos y platos especiales para cada día. Los precios se guardan en centavos para evitar errores.')}<div class="columns"><div class="card"><h2>Editar menú por fecha</h2><form id="menu-form" class="form" style="margin-top:20px">${F('date','Fecha','date',state.day,'required')}${F('soup','Sopa del día','text',selected.soup||'')}${textarea('options','Opciones de almuerzo: una por línea, nombre | precio',options||'Pollo a la plancha | 3.50\nSeco de carne | 3.50\nPescado apanado | 3.50',7)}<label class="row" style="justify-content:flex-start"><input type="checkbox" name="published" ${selected.published?'checked':''}> Publicar menú para los clientes</label><button type="submit" class="button primary">Guardar menú</button></form><p class="hint" style="margin-top:14px">Para un plato especial, añade otra línea con su propio precio. Los pedidos pasados mantienen el importe acordado al comprar.</p></div><div class="card"><h2>Calendario configurado</h2><div class="stack" style="margin-top:15px">${state.menus.length?state.menus.sort((a,b)=>a.date.localeCompare(b.date)).map(m=>`<div class="row" style="padding:12px;border-bottom:1px solid var(--line)"><div><b>${H(dateLabel(m.date))}</b><p class="hint">${H(m.soup||'Sin sopa')} · ${(m.options||[]).length} opciones</p></div><div class="row wrap"><span class="tag ${m.published?'':'warning'}">${m.published?'Publicado':'Borrador'}</span><button data-action="choose-date" data-date="${H(m.date)}" class="button small light">Editar</button></div></div>`).join(''):empty('Aún no has configurado ningún menú.')}</div></div></div>`}
const statuses={pending:'Pago por verificar',confirmed:'Pago confirmado',preparing:'En preparación',in_route:'En camino',delivered:'Entregado',rejected:'Pago rechazado'};
const nextStatuses={pending:[['confirmed','Confirmar pago'],['rejected','Rechazar']],confirmed:[['preparing','Preparar'],['rejected','Rechazar']],preparing:[['in_route','Enviar']],in_route:[['delivered','Entregado']]};
function orderTable(rows,withActions=false){return `<div class="table-scroll"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Almuerzo</th><th>Entrega</th><th>Total</th><th>Estado</th>${withActions?'<th>Acciones</th>':''}</tr></thead><tbody>${rows.map(o=>`<tr><td><b>#${H((o.id||'').slice(0,8))}</b><small class="muted" style="display:block">${H(dateLabel(o.date))}</small></td><td>${H(o.customerName||'')}</td><td>${H(o.quantity||1)} × ${H(o.optionName||'')}</td><td>${H(o.zone||o.address||'')}</td><td><b>${money(o.totalCents)}</b></td><td><span class="tag ${o.status==='pending'?'warning':o.status==='rejected'?'danger':''}">${H(statuses[o.status]||o.status)}</span></td>${withActions?`<td>${button('Comprobante','receipt','light',`data-id="${H(o.id)}"`)} ${(nextStatuses[o.status]||[]).map(([to,label])=>button(label,'order-status',to==='rejected'?'danger':'primary',`data-id="${H(o.id)}" data-status="${H(to)}"`)).join(' ')}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function restOrders(deliveries=false){const rows=state.orders.filter(o=>!deliveries||['confirmed','preparing','in_route','delivered'].includes(o.status));return `${intro(deliveries?'Entregas y reparto':'Pedidos y pagos',deliveries?'Organiza los pedidos confirmados por destino y estado.':'Comprueba la transferencia en tu banco antes de confirmar. No basta con recibir una captura.')}${rows.length?`<div class="card">${orderTable(rows,true)}</div>`:empty(deliveries?'No hay entregas registradas.':'Aún no hay pedidos para revisar.')}<p class="smallnote" style="margin-top:16px">Los cambios de estado quedan registrados. Los comprobantes solo son visibles para usuarios autorizados del mismo restaurante.</p>`}
function restClients(){return `${intro('Clientes','Clientes registrados para tu restaurante.')}<div class="card">${state.customers.length?`<div class="table-scroll"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Dirección</th></tr></thead><tbody>${state.customers.map(c=>`<tr><td>${H(c.name)}</td><td>${H(c.phone)}</td><td>${H(c.address||'')}</td></tr>`).join('')}</tbody></table></div>`:empty('Todavía no tienes clientes registrados.')}</div>`}
function restSettings(){const r=state.restaurant||{},s=r.shipping||{},bank=r.bank||{};return `${intro('Configurar restaurante','Personaliza la información que verá el cliente y cómo calcularás las entregas.')}<form id="settings-form" class="form"><div class="columns"><div class="card"><h2>Identidad comercial</h2><div class="form" style="margin-top:18px">${F('name','Nombre del restaurante','text',r.name||'','required')}${F('phone','WhatsApp / teléfono','tel',r.phone||'')}${textarea('address','Dirección del local',r.address||'')}${F('primary','Color de la marca','color',r.primary||'#18bfa1')}${F('logo','Logo del restaurante','file','','accept="image/png,image/jpeg,image/webp"')}<p class="hint">El logo se comprimirá antes de guardarlo.</p>${r.logo?`<img class="logo" alt="Logo actual" src="${H(r.logo)}">`:''}</div></div><div class="stack"><div class="card"><h2>Banco y horario</h2><div class="form" style="margin-top:18px">${F('cutoff','Hora de cierre de pedidos','time',r.cutoff||'11:00')}${F('bankName','Banco','text',bank.bank||'')}${F('bankOwner','Titular','text',bank.owner||'')}${F('bankAccount','Número de cuenta','text',bank.account||'')}${F('bankType','Tipo de cuenta','text',bank.type||'')}</div></div><div class="card"><h2>Costo de entrega</h2><div class="form" style="margin-top:18px">${sel('shippingMode','Modalidad',[['free','Envío gratuito'],['fixed','Tarifa fija'],['zones','Tarifa por zonas']],s.mode||'free')}${F('fixedCents','Tarifa fija en USD','number',((s.fixedCents||0)/100).toFixed(2),'min="0" step="0.01"')}${textarea('zones','Zonas: nombre | precio (una por línea)',(s.zones||[]).map(z=>z.name+' | '+(z.priceCents/100).toFixed(2)).join('\n'))}</div></div></div></div><button type="submit" class="button primary">Guardar configuración</button></form>`}
function clientHome(){const r=state.restaurant||{},menus=state.menus.filter(m=>m.published&&m.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));const selected=menus.find(m=>m.date===state.day)||menus[0];const color=/^#[a-fA-F0-9]{6}$/.test(r.primary||'')?r.primary:'#14bda2';let content=`<div class="client-layout"><div class="client-hero" style="border-left:5px solid ${color}">${r.logo?`<img class="logo" src="${H(r.logo)}" alt="Logo del restaurante">`:'<div class="logo" style="display:grid;place-items:center;font-size:30px;color:#1d463b">🍲</div>'}<div><p>ALMUERZOS A DOMICILIO Y OFICINA</p><h1>${H(r.name||'Restaurante')}</h1><p>Pedidos de hoy hasta las ${H(r.cutoff||'11:00')} · Entregas según cobertura</p></div></div>${intro('Menú disponible','Elige la fecha y el plato que deseas recibir.')}`;
if(!menus.length)return content+empty('Este restaurante todavía no ha publicado menús para las próximas fechas.')+'</div>';
content+=`<div class="navlinks">${menus.map(m=>`<button class="${m.date===selected.date?'current':''}" data-action="choose-date" data-date="${H(m.date)}">${H(dateLabel(m.date))}</button>`).join('')}</div><div class="columns"><div class="card"><h2>${H(dateLabel(selected.date))}</h2><p class="sub">Sopa del día: <b>${H(selected.soup||'Según disponibilidad')}</b></p><div style="margin-top:16px">${(selected.options||[]).map(o=>`<div class="food-item"><div class="food-avatar">🍽</div><div class="food-body"><b>${H(o.name)}</b><small>Almuerzo · ${money(o.priceCents)}</small></div><button class="button small primary" data-action="choose-meal" data-date="${H(selected.date)}" data-option="${H(o.id)}">Pedir</button></div>`).join('')}</div></div><div class="card"><h2>Entrega y pago</h2><p class="sub">El restaurante recibirá tu comprobante y confirmará manualmente la transferencia.</p><div style="margin-top:18px">${r.shipping?.mode==='free'?'<span class="tag">Envío gratuito</span>':r.shipping?.mode==='fixed'?`<span class="tag">Envío ${money(r.shipping.fixedCents)}</span>`:'<span class="tag">Tarifa según zona</span>'}</div><hr class="divide"><p class="hint">Si realizas un pedido después del cierre, selecciona un menú publicado para otra fecha.</p></div></div></div>`;return content}
function checkout(){const r=state.restaurant||{},menu=state.menus.find(m=>m.date===state.day),o=menu?.options.find(x=>x.id===state.selectedOption);if(!o)return clientHome();const shipping=r.shipping||{},zoneInput=shipping.mode==='zones'?sel('zone','Zona de entrega',(shipping.zones||[]).map(z=>[z.name,z.name+' · '+money(z.priceCents)]),''):'';return `<div class="client-layout">${intro('Confirmar y pagar',`Pedido para ${H(dateLabel(menu.date))}. Se realizará la entrega a la dirección indicada.`)}<div class="columns"><div class="card"><h2>${H(o.name)}</h2><p class="sub">${H(menu.soup||'')} · ${money(o.priceCents)} por almuerzo</p><form id="order-form" class="form" style="margin-top:20px">${F('quantity','Cantidad','number','1','min="1" max="10" required')}${F('address','Dirección completa y referencias','text','','required minlength="12"')}${zoneInput}${textarea('notes','Notas de entrega (opcional)','',2)}${F('bankReference','Número de operación bancaria (si consta)','text','')}${F('proof','Comprobante bancario JPG, PNG, WEBP o PDF (máx. 400 KB)','file','','required accept="image/jpeg,image/png,image/webp,application/pdf"')}<button type="submit" class="button primary">Enviar pedido y comprobante</button></form></div><div class="card"><h2>Realizar transferencia</h2><div class="stack" style="margin-top:17px"><div class="row"><span>Banco</span><b>${H(r.bank?.bank||'No configurado')}</b></div><div class="row"><span>Titular</span><b>${H(r.bank?.owner||'No configurado')}</b></div><div class="row"><span>Cuenta</span><b>${H(r.bank?.account||'No configurada')}</b></div><div class="row"><span>Tipo</span><b>${H(r.bank?.type||'')}</b></div><hr class="divide"><div class="row"><span>Plato</span><b>${money(o.priceCents)}</b></div><div class="row"><span>Envío</span><b>${shipping.mode==='free'?'Gratis':shipping.mode==='fixed'?money(shipping.fixedCents):'Depende de la zona'}</b></div></div><div class="notice warn" style="margin-top:20px">No se considera pagado hasta que el restaurante verifique el depósito. Si tu comprobante se rechaza, comunícate con el establecimiento.</div></div></div></div>`}
function clientOrders(){return `${intro('Mis pedidos','Consulta el estado de tus compras y entregas.')}${state.orders.length?`<div class="card">${orderTable(state.orders)}</div>`:empty('Todavía no has realizado pedidos.')}<p class="hint" style="margin-top:15px">El estado «Pago por verificar» indica que el restaurante todavía no ha confirmado la transferencia.</p>`}
function profile(){return `${intro('Mi cuenta','Datos de acceso y restaurante actual.')}<div class="card stack"><h2>${H(state.user?.name||'Cliente')}</h2><p class="sub">Teléfono: ${H(state.user?.username||'')}<br>Restaurante: ${H(state.slug)}</p>${button('Cerrar sesión','logout','danger')}</div>`}
async function refresh(){if(!state.token)return;if(state.role==='faro'){state.restaurants=await api('/api/admin/restaurants');return}if(state.role==='restaurante'){[state.restaurant,state.menus,state.orders]=await Promise.all([api('/api/restaurant'),api('/api/menus'),api('/api/orders')]);if(state.page==='clients')state.customers=await api('/api/customers');return}if(state.role==='cliente'){state.restaurant=await api('/api/public/restaurants/'+encodeURIComponent(state.slug));[state.menus,state.orders]=await Promise.all([api('/api/public/menus/'+encodeURIComponent(state.slug)),api('/api/orders')]);return}}
async function guestMenu(){const entered=document.querySelector('#login-form [name=restaurantId]')?.value?.trim().toLowerCase();if(entered){state.slug=entered;localStorage.setItem('appsfaro_slug',entered)}if(!state.slug){notify('Escribe primero el código del restaurante.',true);return}try{state.restaurant=await api('/api/public/restaurants/'+encodeURIComponent(state.slug));state.menus=await api('/api/public/menus/'+encodeURIComponent(state.slug));state.page='home';state.register=false;render(true)}catch(e){notify(e.message,true)}}
function render(guest=false){route();if(!connected()){APP.innerHTML=configScreen();return}if(state.setup){APP.innerHTML=setupScreen();return}if(state.register){APP.innerHTML=registerScreen();return}if(!state.user||state.user.role!==({faro:'platform',restaurante:'owner',cliente:'customer'})[state.role]){if(guest&&state.role==='cliente'&&state.restaurant){APP.innerHTML=layout(clientHome());return}APP.innerHTML=loginScreen();return}
let view='';if(state.role==='faro')view=state.page==='businesses'?faroBusinesses():faroHome();if(state.role==='restaurante')view=({home:restHome,menu:restMenu,orders:()=>restOrders(false),deliveries:()=>restOrders(true),clients:restClients,settings:restSettings}[state.page]||restHome)();if(state.role==='cliente')view=({home:clientHome,checkout,orders:clientOrders,profile}[state.page]||clientHome)();APP.innerHTML=layout(view)}
function captureError(error){state.error=error.message||'No fue posible completar la solicitud';state.message='';render()}
async function fileData(file,limit){if(!file)throw Error('Debes seleccionar un archivo');if(file.size>limit)throw Error('Archivo demasiado grande. El límite es '+Math.ceil(limit/1024)+' KB.');return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result));fr.onerror=()=>reject(Error('No se pudo leer el archivo'));fr.readAsDataURL(file)})}
async function logoData(file){if(!file||!file.size)return state.restaurant?.logo||'';if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('Solo imágenes para el logo');if(file.size>4*1024*1024)throw Error('La imagen del logo supera 4 MB');const src=await fileData(file,4*1024*1024);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Logo inválido'));img.src=src});const canvas=document.createElement('canvas');canvas.width=180;canvas.height=180;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,180,180);const scale=Math.min(180/img.width,180/img.height);ctx.drawImage(img,(180-img.width*scale)/2,(180-img.height*scale)/2,img.width*scale,img.height*scale);return canvas.toDataURL('image/jpeg',.72)}
async function receiptFile(file){if(!file)throw Error('Debes subir el comprobante');const valid=['image/jpeg','image/png','image/webp','application/pdf'];if(!valid.includes(file.type))throw Error('Formato de comprobante inválido');if(file.type==='application/pdf'){const s=await fileData(file,400*1024);return {name:file.name,mime:file.type,base64:s.split(',')[1]}}const s=await fileData(file,5*1024*1024);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Imagen de comprobante inválida'));img.src=s});const max=1200,ratio=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.floor(img.width*ratio);c.height=Math.floor(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.65);if(data.length>560000)data=c.toDataURL('image/jpeg',.38);if(data.length>560000)throw Error('El comprobante es demasiado grande; utiliza una imagen más pequeña');return{name:file.name,mime:'image/jpeg',base64:data.split(',')[1]}}
document.addEventListener('submit',async ev=>{const form=ev.target;if(!['api-form','login-form','bootstrap-form','register-form','business-form','menu-form','settings-form','order-form'].includes(form.id))return;ev.preventDefault();const submit=form.querySelector('[type="submit"]');if(submit)submit.disabled=true;try{const d=formData(form);state.error='';state.message='';if(form.id==='api-form'){const url=d.apiUrl.trim().replace(/\/+$/,'');if(!/^https:\/\//.test(url)&&!/^http:\/\/localhost/.test(url))throw Error('La API debe utilizar HTTPS');state.api=url;const health=await api('/api/health');if(!health.firestoreConfigured)throw Error('La API está activa, pero todavía falta configurar las credenciales privadas de Firestore');localStorage.setItem('appsfaro_api',url);notify('Servidor conectado. Ahora puedes iniciar sesión.');return}
if(form.id==='login-form'){if(d.restaurantId){state.slug=d.restaurantId.toLowerCase();localStorage.setItem('appsfaro_slug',state.slug)}await login({role:{faro:'platform',restaurante:'owner',cliente:'customer'}[state.role],restaurantId:state.slug,username:d.username,password:d.password});return}
if(form.id==='bootstrap-form'){await api('/api/bootstrap',{method:'POST',body:d});state.setup=false;notify('Administrador creado. Inicia sesión.');return}
if(form.id==='register-form'){state.slug=d.restaurantId.toLowerCase();localStorage.setItem('appsfaro_slug',state.slug);await api('/api/register',{method:'POST',body:{restaurantId:state.slug,...d}});state.register=false;await login({role:'customer',restaurantId:state.slug,username:d.phone,password:d.pin});return}
if(form.id==='business-form'){await api('/api/admin/restaurants',{method:'POST',body:d});await refresh();notify('Restaurante registrado. Entrega las credenciales al propietario de forma privada.');return}
if(form.id==='menu-form'){const rows=d.options.split(/\r?\n/).filter(Boolean).map(line=>{const i=line.lastIndexOf('|');if(i<1)throw Error('Cada plato necesita nombre | precio');return{name:line.slice(0,i).trim(),priceCents:priceValue(line.slice(i+1))}});const body={date:d.date,soup:d.soup,options:rows,published:form.elements.namedItem('published').checked};await api('/api/menus',{method:'PUT',body});state.day=d.date;await refresh();notify('Menú guardado en Firestore.');return}
if(form.id==='settings-form'){const logo=await logoData(form.elements.namedItem('logo').files[0]);const zones=d.zones.split(/\r?\n/).filter(Boolean).map(line=>{const i=line.lastIndexOf('|');if(i<1)throw Error('Zona inválida: escribe nombre | precio');return{name:line.slice(0,i).trim(),priceCents:priceValue(line.slice(i+1))}});const body={name:d.name,phone:d.phone,address:d.address,primary:d.primary,logo,cutoff:d.cutoff,bank:{bank:d.bankName,owner:d.bankOwner,account:d.bankAccount,type:d.bankType},shipping:{mode:d.shippingMode,fixedCents:priceValue(d.fixedCents),zones}};await api('/api/restaurant',{method:'PATCH',body});await refresh();notify('Configuración guardada correctamente.');return}
if(form.id==='order-form'){const proof=await receiptFile(form.elements.namedItem('proof').files[0]);const body={date:state.day,optionId:state.selectedOption,quantity:Number(d.quantity),address:d.address,zone:d.zone||'',notes:d.notes,bankReference:d.bankReference,proof};const r=await api('/api/orders',{method:'POST',body});await refresh();state.page='orders';location.hash='#/cliente/orders';notify('Pedido #'+r.id.slice(0,8)+' recibido. Tu pago está pendiente de verificación bancaria.');return}
}catch(error){captureError(error)}finally{if(submit)submit.disabled=false}});
document.addEventListener('click',async ev=>{const btn=ev.target.closest('[data-action]');if(!btn)return;ev.preventDefault();const type=btn.dataset.action;try{
if(type==='logout'){signout();return}if(type==='change-api'){signout(false);state.api='';localStorage.removeItem('appsfaro_api');render();return}if(type==='bootstrap'){state.setup=true;render();return}if(type==='register'){state.register=true;render();return}if(type==='back'){state.setup=false;state.register=false;render();return}if(type==='repo'){window.open('https://github.com/Appsfaro/restaurante','_blank','noopener');return}if(type==='public-menu'){await guestMenu();return}if(type==='choose-date'){state.day=btn.dataset.date;render(!state.user);return}if(type==='choose-meal'){if(!state.user){notify('Inicia sesión o crea una cuenta para realizar un pedido.',true);return}state.day=btn.dataset.date;state.selectedOption=btn.dataset.option;state.page='checkout';location.hash='#/cliente/checkout';render();return}
if(type==='receipt'){const r=await api('/api/orders/'+encodeURIComponent(btn.dataset.id)+'/receipt');const raw=atob(r.base64);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);const objectURL=URL.createObjectURL(new Blob([out],{type:r.mime}));const a=document.createElement('a');a.href=objectURL;a.download=r.name||'comprobante';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectURL),30000);return}
if(type==='order-status'){const next=btn.dataset.status;if(!confirm(next==='confirmed'?'¿Comprobaste que el dinero llegó a la cuenta bancaria?':'¿Cambiar estado del pedido a '+(statuses[next]||next)+'?'))return;await api('/api/orders/'+encodeURIComponent(btn.dataset.id)+'/status',{method:'PATCH',body:{status:next}});await refresh();notify('Estado actualizado.');return}
if(type==='save-business'||type==='toggle-business'){const r=state.restaurants.find(x=>x.slug===btn.dataset.slug);const date=document.querySelector('[data-date="'+btn.dataset.slug+'"]')?.value||r.subscriptionUntil;await api('/api/admin/restaurants/'+encodeURIComponent(r.slug),{method:'PATCH',body:{active:type==='toggle-business'?!r.active:r.active,subscriptionUntil:date}});await refresh();notify('Suscripción actualizada.');return}
}catch(error){captureError(error)}});
window.addEventListener('hashchange',async()=>{route();if(state.user){try{if(state.page==='clients'&&state.role==='restaurante')state.customers=await api('/api/customers');render()}catch(e){captureError(e)}}else render()});
(async()=>{route();if(state.api&&state.user){try{await refresh()}catch(error){state.error=error.message}}render()})();
</script></body></html>
