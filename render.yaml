services:
  - type: web
    name: appsfaro-restaurantes
    runtime: node
    plan: free  # Solo para pruebas; elegir Starter para operación comercial continua
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: REQUIRE_OBJECT_STORAGE
        value: "true"
